# Система метрик

Единый источник правды по метрикам сервиса. Метрики считаются в DataLens.

**Структура:** метрики разбиты на 8 групп. У каждой метрики паспорт: определение, формула, разрезы, события-источники, частота. Колонка «События-источники» — мост к документу «События»: таблица событий собирается из неё.


---

## Г1. Трафик

Откуда приходят. Источники — внешние системы: Я.Метрика и Keitaro, продуктовых событий не требуют.

| Метрика | Что показывает | Формула | Разрезы | Источник | Частота |
|---|---|---|---|---|---|
| Общий трафик | Все визиты сайта | Визиты за период | локаль, источник, устройство | Я.Метрика | день |
| Клики в кейтаро | Клики с платного трафика и партнёрки | Клики за период | кампания, источник, гео | Keitaro | день |
| РУ трафик | Визиты из РФ | Визиты с гео = RU | источник | Я.Метрика | день |
| Трафик других регионов | Визиты вне РФ | Визиты с гео ≠ RU | гео, источник | Я.Метрика | день |
| Поисковый трафик | Органика из поиска | Визиты с каналом = organic | поисковик, локаль | Я.Метрика | день |
| Трафик со статей | Переходы с контент-площадок | Визиты с реферером = статьи | площадка, статья | Я.Метрика | день |

---

## Г2. Выручка и платежи

Сколько денег и через что. Суммы — в валюте платежа, сводная — приведение по курсу (внутренняя отчётность).

| Метрика | Что показывает | Формула | Разрезы | События-источники | Частота |
|---|---|---|---|---|---|
| Доход | Вся выручка | Σ `payment.succeeded` | тариф/пакет, период, локаль, валюта, способ | `payment.succeeded` | день |
| Доход по автосписаниям | Выручка рекуррента | Σ `payment.succeeded` с признаком автосписания | тариф, период, валюта | `payment.succeeded` (recurring = true) | день |
| Доход по платёжкам | Разрез по провайдерам | Σ по провайдеру: РУ платёжка / EN платёжка / крипта | провайдер, способ, валюта | `payment.succeeded` (provider) | день |
| Выручка от пакетов токенов | Деньги от докупки и её доля в общем доходе | Σ `payment.succeeded` (type = pack) и доля от Дохода | номинал пакета, тариф, локаль, валюта | `payment.succeeded` (type = pack) | день |
| Покупки пакетов | Сколько пакетов покупают и какие номиналы выбирают | Число `tokens.pack_purchased` и распределение по номиналам S / M / L | номинал, тариф, локаль | `tokens.pack_purchased` | день |
| Повторные покупки пакетов | Возвращаются ли за докупкой | Доля покупателей с ≥2 пакетами за 90 дней; среднее покупок на покупателя | тариф, номинал | `tokens.pack_purchased` | месяц |

---

## Г3. Воронка конверсии

Путь от клика до денег.

<div class="fun">
<div class="fstep fs1"><span>Клики</span><code>Keitaro</code></div>
<div class="fconv">C2R <b>клик → регистрация</b></div>
<div class="fstep fs2"><span>Регистрации</span><code>auth.signup_completed</code></div>
<div class="fconv">R2D <b>регистрация → оплата</b> · главная точка продажи — <b>стена Free</b></div>
<div class="fstep fs3"><span>Первые оплаты</span><code>subscription.started</code>
<div class="fbranch wrm">Стена Free<small>quota.message_blocked → оплата за 72 ч</small></div></div>
<div class="fnote">Сквозные: C2D — клик → оплата · RPC — доход на клик</div>
</div>

| Метрика | Что показывает | Формула | Разрезы | События-источники | Частота |
|---|---|---|---|---|---|
| Регистрации | Новые аккаунты | Число `auth.signup_completed` | локаль, источник, кампания | `auth.signup_completed` | день |
| Новые подписки | Первые оплаты | Число `subscription.started` | тариф, период, локаль, способ оплаты | `subscription.started` | день |
| C2R | Конверсия клика в регистрацию | Регистрации ÷ клики Keitaro | кампания, источник | `auth.signup_completed` + Keitaro | день |
| R2D | Конверсия регистрации в первую оплату | Новые подписки ÷ регистрации, когорта регистрации | когорта, источник, локаль | `subscription.started`, `auth.signup_completed` | день |
| C2D | Сквозная конверсия клика в оплату | Новые подписки ÷ клики | кампания, источник | `subscription.started` + Keitaro | день |
| RPC | Доход на клик | Доход ÷ клики | кампания, источник | `payment.succeeded` + Keitaro | день |
| **Конверсия стены Free** | Доля упёршихся в квоту 5/мес, оплативших в 72 ч | Оплатившие ÷ получившие `quota.message_blocked`, окно 72 ч | когорта, локаль, источник | `quota.message_blocked`, `payment.succeeded` | день |

---

## Г4. Воронка оплат

От нажатия «Получить тариф» до успешного платежа. Показывает, где именно теряются деньги внутри чекаута.

<div class="fun">
<div class="fstep fs1"><span>Клик «Получить тариф»</span><code>checkout.opened</code></div>
<div class="fconv"><b>дошли до выбора способа</b></div>
<div class="fstep fs2"><span>Выбор способа оплаты</span><code>payment_method.selected</code></div>
<div class="fconv"><b>инициации оплаты</b></div>
<div class="fstep fs3"><span>Передача в шлюз</span><code>checkout.started</code>
<div class="fbranch">✗ Отказы по кодам<small>payment.failed · decline_code</small></div></div>
<div class="fconv"><b>конверсия чекаута</b></div>
<div class="fstep fs4"><span>Успешная оплата</span><code>payment.succeeded</code>
<div class="fbranch wrm">↩ Восстановление после отказа<small>оплата в 24 ч после payment.failed</small></div></div>
<div class="fnote">Брошенные корзины — вошёл, но не оплатил за 60 мин · checkout.abandoned</div>
</div>

| Этапы | Что показывает | Формула | Разрезы | События-источники | Частота |
|---|---|---|---|---|---|
| Клики «Получить тариф» | Вход в воронку оплаты | Число `checkout.opened` | тариф, период, локаль, точка входа (карточка / стена Free / стена Premium / нехватка токенов / VIP-плашка) | `checkout.opened` | день |
| Выбор способа оплаты | Дошли до выбора способа | Число `payment_method.selected`, доля от кликов | способ, тариф | `payment_method.selected` | день |
| Инициации оплаты | Переданы в платёжный шлюз | Число `checkout.started` | способ, провайдер, валюта | `checkout.started` | день |
| Конверсия чекаута | Сквозная: клик → деньги | `payment.succeeded` ÷ `checkout.opened`, с разбивкой отвала по шагам | тариф, способ, локаль, точка входа | `checkout.opened`, `payment_method.selected`, `checkout.started`, `payment.succeeded` | день |
| Брошенные корзины | Открыл чекаут — не оплатил | Число и доля `checkout.abandoned`: нет `payment.succeeded` в течение 60 мин после `checkout.opened` | шаг отвала, тариф, способ | `checkout.abandoned` (производное) | день |
| Неуспешные оплаты по кодам | Отказы шлюза с причинами | Число и доля `payment.failed` от инициаций, распределение по `decline_code`: недостаточно средств / карта истекла / отклонено банком / ошибка 3-D Secure / прочее | decline_code, провайдер, способ, первичная или рекуррентная | `payment.failed` | день |
| Восстановление после отказа | Вернулись и оплатили после отказа | Доля `payment.failed`, за которыми `payment.succeeded` в течение 24 ч | decline_code, способ | `payment.failed`, `payment.succeeded` | день |

---

## Г5. Подписки: продления и переходы

Что происходит с базой платящих.

| Метрика | Что показывает | Формула | Разрезы | События-источники | Частота |
|---|---|---|---|---|---|
| Автопродления | Успешные продления | Число `subscription.renewed` | тариф, период, способ | `subscription.renewed` | день |
| Количество списаний по карте | Все успешные рекуррентные списания | Число `payment.succeeded` (recurring, карта) | провайдер, тариф | `payment.succeeded` | день |
| Сумма списаний по карте | Объём рекуррентных списаний | Σ тех же событий | провайдер, тариф | `payment.succeeded` | день |
| Подписок в прошлый период по карте | База продления: сколько подписок подлежало списанию | Число `subscription.renewal_due` за период | тариф, период | `subscription.renewal_due` | день |
| % Списаний | Доля успешных продлений от базы | Автопродления ÷ база продления | тариф, период, провайдер | `subscription.renewed`, `subscription.renewal_due` | день |
| **M1 Churn Rate** | Отток первого месяца — главная метрика выживания. **Сейчас ~92%, цель 60–70%** | Доля когорты первых оплат месячного тарифа без `subscription.renewed` в окне 35 дней от конца периода. Только месячный период; 3 мес и 1 год — отдельные кривые | когорта оплаты, тариф, локаль, источник | `subscription.started`, `subscription.renewed`, `subscription.expired` | месяц, по закрытым когортам |
| Апгрейды | Переходы вверх | Число `subscription.upgraded`: Premium → VIP, Legacy → VIP | из-тарифа, в-тариф, локаль | `subscription.upgraded` | день |
| Даунгрейды | Переходы вниз | Число `subscription.downgraded`: VIP → Premium, Legacy → Premium | из-тарифа, в-тариф | `subscription.downgraded` | день |
| **Конверсия стены Premium** | Доля упёршихся в 500/день, перешедших на VIP в 72 ч | Апгрейды ÷ получившие `message_limit.reached` (tier = premium), окно 72 ч | когорта, локаль | `message_limit.reached`, `subscription.upgraded` | день |

## Г6. Удержание после оплаты

Качество платящей базы: возвращаются ли и общаются ли после денег. Якорь всех метрик — **дата оплаты**, не регистрации.

| Метрика | Что показывает | Формула | Разрезы | События-источники | Частота |
|---|---|---|---|---|---|
| Retention D1…D-N после оплаты | Доля вернувшихся на N-й день после оплаты | Доля когорты оплативших с ≥1 `chat.message_sent` в интервале [оплата + N дней, + N+1 день). Сетка: D1, D2, D3, D7, D14, D30 | тариф, период, когорта, локаль | `subscription.started`, `chat.message_sent` | день |
| Медиана сообщений, 24 ч | Глубина общения сразу после оплаты | p50 сообщений в окне [оплата, +24 ч) по когорте. Только закрытые окна | тариф, когорта | `chat.message_sent` | день |
| Медиана сообщений, 7 дней | Глубина общения первой недели | p50 сообщений в окне [оплата, +7 дней). Только закрытые окна | тариф, когорта | `chat.message_sent` | день |

## Г7. Использование фич

За что реально платят. Все метрики — в разрезе тарифов; это прямой ответ, какие фичи продают Premium и VIP.

| Метрика | Что показывает | Формула | Разрезы | События-источники | Частота |
|---|---|---|---|---|---|
| Usage: сообщения | Общение — базовая активность | Доля активных пользователей тарифа с ≥1 сообщением за период + число сообщений. Отдельно: доля общения с каталожными и своими компаньонами | тариф (Free/Premium/VIP/Legacy), локаль, тип компаньона, период 7/30 дней | `chat.message_sent` | день |
| Usage: создание компаньонов | Используется ли платная возможность создать своего | Доля активных Premium/VIP, создавших ≥1 компаньона за период + число созданий | тариф, локаль, период 7/30 дней | `companion.created` | день |
| Usage: генерация фото | Использование главной токеновой операции | Доля активных пользователей тарифа с ≥1 генерацией за период + число генераций | тариф, локаль, период 7/30 дней | `photo.generated` | день |
| Usage: аудио сообщения | Использование аудио | Доля активных пользователей тарифа с ≥1 аудио за период + число отправок | тариф, локаль, период 7/30 дней | `audio.sent` | день |
| Usage: генерация видео | Использование VIP-операции видео | Доля активных VIP с ≥1 генерацией за период + число генераций | локаль, период 7/30 дней | `video.generated` | день |
| Usage: аудио звонки | Использование VIP-операции звонков | Доля активных VIP с ≥1 звонком за период + число и длительность звонков | локаль, период 7/30 дней | `call.completed` | день |
| Usage: групповые чаты | Использование VIP-функции групп | Доля активных VIP с ≥1 сообщением в группе за период + число сообщений | локаль, период 7/30 дней | `group_chat.message_sent` | день |
| Расход токенов по операциям | На что уходят токены | Σ `tokens.spent` по операциям, доля каждой | тариф, операция, источник токенов | `tokens.spent` | день |
| Доля исчерпавших транш | Кому не хватает месячного объёма | Доля платных с балансом тарифных токенов = 0 до конца цикла | тариф, период | `tokens.exhausted` | день |
| Конверсия нехватки токенов | Продающая сила отказа операции | Доля получивших `tokens.blocked_action`, купивших пакет или VIP в 72 ч | тариф, операция | `tokens.blocked_action`, `tokens.pack_purchased`, `subscription.upgraded` | день |

## Г8. Юнит-экономика

Маржа и себестоимость. Считается на внутренних переменных `*_COGS` — пользователю ничего из этой группы не показывается. Метрики ценовой лестницы и калибровки траншей — в документе [«Токеномика»](index.html), раздел 14.

| Метрика | Что показывает | Формула | Разрезы | События-источники | Частота |
|---|---|---|---|---|---|
| Маржа операции | Продаётся ли операция выше себестоимости | Стоимость в токенах × фактическая цена токена сегмента − `*_COGS` | операция, тариф, валюта | `tokens.spent` + переменные `*_COGS` | месяц |
| Себестоимость пользователя за период | Затраты на одного пользователя | Σ (выполненные операции × их `*_COGS`) + сообщения × `MESSAGE_COGS` | тариф, период, локаль | события операций, `chat.message_sent` | месяц |
| Маржа тарифа | Прибыльность тарифа | Цена тарифа − средняя себестоимость пользователя тарифа | тариф × период, локаль | производная | месяц |
| Доля убыточных платных | Сколько пользователей стоят дороже, чем платят | Доля платных с себестоимостью периода выше цены тарифа. Порог тревоги `UNPROFITABLE_SHARE_ALERT` | тариф, период | производная | месяц |
| Распределение маржи | Разброс прибыльности — среднее непоказательно, тяжёлые пользователи его смещают | p10 / p50 / p90 маржи пользователей | тариф | производная | месяц |
| Себестоимость пробного набора на одну оплату | Окупается ли welcome-набор, ограничитель его состава | Себестоимость пробных операций когорты ÷ число оплат когорты | состав набора, когорта | события пробных операций, `subscription.started` | месяц |
| Объём замороженных токенов | Отложенное обязательство перед ушедшими | Σ замороженного баланса | — | `tokens.frozen`, `tokens.unfrozen` | день |
| Возвраты с замороженным остатком | Работает ли заморозка как механика возврата | Доля вернувшихся среди упавших на Free с замороженным остатком против без него | — | `subscription.reverted_to_free`, `subscription.reactivated` | месяц |

Контур управления: маржа операции корректируется переменной `*_COST` (цена в токенах), маржа тарифа — объёмом транша и ценами тарифов. Себестоимости `*_COGS` — измеряемый вход, а не рычаг.

<script>
  const raw = document.getElementById("src").textContent;
  document.getElementById("out").innerHTML = marked.parse(raw, {gfm:true});


  document.querySelectorAll("#out table td, #out p, #out li").forEach(td => {
    if (/[\u{1F514}\u2709\u{1F4AC}]/u.test(td.textContent)) {
      td.innerHTML = td.innerHTML
        .replace(/🔔/g, '<span class="ch ch-bell"><i>🔔</i>колокольчик</span>')
        .replace(/✉/g, '<span class="ch ch-mail"><i>✉️</i>email</span>')
        .replace(/💬/g, '<span class="ch ch-chat"><i>💬</i>чат компаньона</span>')
        .replace(/<\/span> \+ <span/g, '</span> <span');
    }
  });

  document.querySelectorAll("#out table").forEach(tb => {
    const heads = [...tb.querySelectorAll("th")].map(th => th.textContent.trim());
    const cutIdx = heads.indexOf("Разрезы");
    let evIdx = heads.indexOf("События-источники");
    if (evIdx < 0) evIdx = heads.indexOf("Источник");
    tb.querySelectorAll("tr").forEach(tr => {
      const tds = tr.children;
      if (cutIdx >= 0 && tds[cutIdx] && tds[cutIdx].tagName === "TD") {
        const txt = tds[cutIdx].textContent.trim();
        if (txt && txt !== "—")
          tds[cutIdx].innerHTML = txt.split(",").map(p => '<span class="chip-cut">' + p.trim() + "</span>").join("");
      }
      if (evIdx >= 0 && tds[evIdx] && tds[evIdx].tagName === "TD") {
        tds[evIdx].innerHTML = tds[evIdx].innerHTML
          .replace(/Keitaro/g, '<span class="chip-ext">Keitaro</span>')
          .replace(/Я\.Метрика/g, '<span class="chip-ext">Я.Метрика</span>');
      }
    });
  });


(function(){
  const main = document.querySelector("main");
  const toc = document.getElementById("toc");
  const heads = main.querySelectorAll(".md h2, .md h3, .proto-label b");
  let n = 0;
  const t = document.createElement("div"); t.className = "toc-t"; t.textContent = "Оглавление"; toc.appendChild(t);
  const items = [];
  let curSub = null, curParent = null;
  heads.forEach(h => {
    const proto = h.closest(".proto");
    const target = proto || h;
    if (!target.id) target.id = "sec-" + (n++);
    target.style.scrollMarginTop = "70px";
    const a = document.createElement("a");
    a.href = "#" + target.id;
    a.textContent = proto ? "Прототип: " + h.textContent : h.textContent;
    const isChild = (h.tagName === "H3" && !proto);
    if (isChild) {
      a.className = "h3";
      if (!curSub) {
        curSub = document.createElement("div"); curSub.className = "toc-sub";
        toc.appendChild(curSub);
        if (curParent) curParent.sub = curSub;
      }
      curSub.appendChild(a);
      items.push({target, a, parent: curParent});
    } else {
      curSub = null;
      const row = document.createElement("div"); row.className = "toc-row";
      row.appendChild(a); toc.appendChild(row);
      const it = {target, a, row, sub: null, tgl: null};
      curParent = it; items.push(it);
    }
  });
  items.forEach(it => {
    if (it.sub) {
      const b = document.createElement("button"); b.className = "toc-tgl"; b.textContent = "\u25B6";
      b.addEventListener("click", () => {
        const open = it.sub.classList.toggle("open");
        b.classList.toggle("open", open);
      });
      it.row.appendChild(b); it.tgl = b;
    }
  });
  function setOpen(it, open){
    if (it && it.sub){ it.sub.classList.toggle("open", open); it.tgl.classList.toggle("open", open); }
  }
  let lastOwner = null;
  function onScroll(){
    let cur = items[0];
    for (const it of items) {
      if (it.target.getBoundingClientRect().top <= 90) cur = it; else break;
    }
    items.forEach(it => it.a.classList.toggle("active", it === cur));
    const owner = cur ? (cur.parent || cur) : null;
    if (owner !== lastOwner) { setOpen(owner, true); lastOwner = owner; }
  }
  addEventListener("scroll", onScroll, {passive:true}); onScroll();
})();
