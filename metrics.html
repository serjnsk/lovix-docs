# Система метрик

Единый источник правды по метрикам сервиса. Аудитории: разработчики (события и триггеры собираются отсюда), аналитики (формулы и разрезы), маркетинг (что видим и на что влияем). Метрики считаются в DataLens.

**Структура:** метрики разбиты на 8 групп. У каждой метрики паспорт: тип, определение, формула, разрезы, события-источники, частота. Колонка «События-источники» — мост к документу «События»: таблица событий собирается из неё.

**Типы:** **К** — количественная (объёмы, деньги, конверсии) · **Ч** — качественная (поведение базы: retention, usage, churn).

## Глоссарий

| Аббревиатура | Расшифровка |
|---|---|
| C2R | Click → Registration: регистрации ÷ клики из кейтаро |
| R2D | Registration → Deposit: первые оплаты ÷ регистрации |
| C2D | Click → Deposit: первые оплаты ÷ клики |
| RPC | Revenue per Click: доход ÷ клики |
| Стена Free | Исчерпание квоты 5 сообщений/мес на бесплатном тарифе |
| Стена Premium | Достижение дневного лимита 500 сообщений на Premium |

## Г1. Трафик

Откуда приходят. Источники — внешние системы: Я.Метрика и Keitaro, продуктовых событий не требуют. Аудитория: маркетинг.

| Метрика | Тип | Что показывает | Формула | Разрезы | Источник | Частота |
|---|---|---|---|---|---|---|
| Общий трафик | К | Все визиты сайта | Визиты за период | локаль, источник, устройство | Я.Метрика | день |
| Клики в кейтаро | К | Клики с платного трафика и партнёрки | Клики за период | кампания, источник, гео | Keitaro | день |
| РУ трафик | К | Визиты из РФ | Визиты с гео = RU | источник | Я.Метрика | день |
| Трафик других регионов | К | Визиты вне РФ | Визиты с гео ≠ RU | гео, источник | Я.Метрика | день |
| Поисковый трафик | К | Органика из поиска | Визиты с каналом = organic | поисковик, локаль | Я.Метрика | день |
| Трафик со статей | К | Переходы с контент-площадок | Визиты с реферером = статьи | площадка, статья | Я.Метрика | день |

---

## Г2. Воронка конверсии

Путь от клика до денег. Аудитория: маркетинг + аналитика.

| Метрика | Тип | Что показывает | Формула | Разрезы | События-источники | Частота |
|---|---|---|---|---|---|---|
| Регистрации | К | Новые аккаунты | Число `auth.signup_completed` | локаль, источник, кампания | `auth.signup_completed` | день |
| Новые подписки | К | Первые оплаты | Число `subscription.started` | тариф, период, локаль, способ оплаты | `subscription.started` | день |
| C2R | К | Конверсия клика в регистрацию | Регистрации ÷ клики Keitaro | кампания, источник | `auth.signup_completed` + Keitaro | день |
| R2D | К | Конверсия регистрации в первую оплату | Новые подписки ÷ регистрации, когорта регистрации | когорта, источник, локаль | `subscription.started`, `auth.signup_completed` | день |
| C2D | К | Сквозная конверсия клика в оплату | Новые подписки ÷ клики | кампания, источник | `subscription.started` + Keitaro | день |
| RPC | К | Доход на клик | Доход ÷ клики | кампания, источник | `payment.succeeded` + Keitaro | день |
| **Конверсия стены Free** | К | Доля упёршихся в квоту 5/мес, оплативших в 72 ч | Оплатившие ÷ получившие `quota.message_blocked`, окно 72 ч | когорта, локаль, источник | `quota.message_blocked`, `payment.succeeded` | день |

---

## Г3. Воронка оплат

От нажатия «Получить тариф» до успешного платежа. Показывает, где именно теряются деньги внутри чекаута. Аудитория: продукт + разработка.

Этапы: клик «Получить тариф» → выбор способа оплаты → передача в шлюз → успех / отказ / брошено.

| Метрика | Тип | Что показывает | Формула | Разрезы | События-источники | Частота |
|---|---|---|---|---|---|---|
| Клики «Получить тариф» | К | Вход в воронку оплаты | Число `checkout.opened` | тариф, период, локаль, точка входа (карточка / стена Free / стена Premium / нехватка токенов / VIP-плашка) | `checkout.opened` | день |
| Выбор способа оплаты | К | Дошли до выбора способа | Число `payment_method.selected`, доля от кликов | способ, тариф | `payment_method.selected` | день |
| Инициации оплаты | К | Переданы в платёжный шлюз | Число `checkout.started` | способ, провайдер, валюта | `checkout.started` | день |
| Конверсия чекаута | К | Сквозная: клик → деньги | `payment.succeeded` ÷ `checkout.opened`, с разбивкой отвала по шагам | тариф, способ, локаль, точка входа | `checkout.opened`, `payment_method.selected`, `checkout.started`, `payment.succeeded` | день |
| Брошенные корзины | К | Открыл чекаут — не оплатил | Число и доля `checkout.abandoned`: нет `payment.succeeded` в течение 60 мин после `checkout.opened` | шаг отвала, тариф, способ | `checkout.abandoned` (производное) | день |
| Неуспешные оплаты по кодам | К | Отказы шлюза с причинами | Число и доля `payment.failed` от инициаций, распределение по `decline_code`: недостаточно средств / карта истекла / отклонено банком / ошибка 3-D Secure / прочее | decline_code, провайдер, способ, первичная или рекуррентная | `payment.failed` | день |
| Восстановление после отказа | К | Вернулись и оплатили после отказа | Доля `payment.failed`, за которыми `payment.succeeded` в течение 24 ч | decline_code, способ | `payment.failed`, `payment.succeeded` | день |

## Г4. Выручка и платежи

Сколько денег и через что. Суммы — в валюте платежа, сводная — приведение по курсу (внутренняя отчётность). Аудитория: все.

| Метрика | Тип | Что показывает | Формула | Разрезы | События-источники | Частота |
|---|---|---|---|---|---|---|
| Доход | К | Вся выручка | Σ `payment.succeeded` | тариф/пакет, период, локаль, валюта, способ | `payment.succeeded` | день |
| Доход по автосписаниям | К | Выручка рекуррента | Σ `payment.succeeded` с признаком автосписания | тариф, период, валюта | `payment.succeeded` (recurring = true) | день |
| Доход по платёжкам | К | Разрез по провайдерам | Σ по провайдеру: РУ платёжка / EN платёжка / крипта | провайдер, способ, валюта | `payment.succeeded` (provider) | день |

---

## Г5. Подписки: продления и переходы

Что происходит с базой платящих. Аудитория: продукт + аналитика.

| Метрика | Тип | Что показывает | Формула | Разрезы | События-источники | Частота |
|---|---|---|---|---|---|---|
| Автопродления | К | Успешные продления | Число `subscription.renewed` | тариф, период, способ | `subscription.renewed` | день |
| Количество списаний по карте | К | Все успешные рекуррентные списания | Число `payment.succeeded` (recurring, карта) | провайдер, тариф | `payment.succeeded` | день |
| Сумма списаний по карте | К | Объём рекуррентных списаний | Σ тех же событий | провайдер, тариф | `payment.succeeded` | день |
| Подписок в прошлый период по карте | К | База продления: сколько подписок подлежало списанию | Число `subscription.renewal_due` за период | тариф, период | `subscription.renewal_due` | день |
| % Списаний | К | Доля успешных продлений от базы | Автопродления ÷ база продления | тариф, период, провайдер | `subscription.renewed`, `subscription.renewal_due` | день |
| **M1 Churn Rate** | Ч | Отток первого месяца — главная метрика выживания. **Сейчас ~92%, цель 60–70%** | Доля когорты первых оплат месячного тарифа без `subscription.renewed` в окне 35 дней от конца периода. Только месячный период; 3 мес и 1 год — отдельные кривые | когорта оплаты, тариф, локаль, источник | `subscription.started`, `subscription.renewed`, `subscription.expired` | месяц, по закрытым когортам |
| Апгрейды | К | Переходы вверх | Число `subscription.upgraded`: Premium → VIP, Legacy → VIP | из-тарифа, в-тариф, локаль | `subscription.upgraded` | день |
| Даунгрейды | К | Переходы вниз | Число `subscription.downgraded`: VIP → Premium, Legacy → Premium | из-тарифа, в-тариф | `subscription.downgraded` | день |
| **Конверсия стены Premium** | К | Доля упёршихся в 500/день, перешедших на VIP в 72 ч | Апгрейды ÷ получившие `message_limit.reached` (tier = premium), окно 72 ч | когорта, локаль | `message_limit.reached`, `subscription.upgraded` | день |

## Г6. Удержание после оплаты

Качество платящей базы: возвращаются ли и общаются ли после денег. Якорь всех метрик — **дата оплаты**, не регистрации. Аудитория: продукт.

| Метрика | Тип | Что показывает | Формула | Разрезы | События-источники | Частота |
|---|---|---|---|---|---|---|
| Retention D1…D-N после оплаты | Ч | Доля вернувшихся на N-й день после оплаты | Доля когорты оплативших с ≥1 `chat.message_sent` в интервале [оплата + N дней, + N+1 день). Сетка: D1, D2, D3, D7, D14, D30 | тариф, период, когорта, локаль | `subscription.started`, `chat.message_sent` | день |
| Медиана сообщений, 24 ч | Ч | Глубина общения сразу после оплаты | p50 сообщений в окне [оплата, +24 ч) по когорте. Только закрытые окна | тариф, когорта | `chat.message_sent` | день |
| Медиана сообщений, 7 дней | Ч | Глубина общения первой недели | p50 сообщений в окне [оплата, +7 дней). Только закрытые окна | тариф, когорта | `chat.message_sent` | день |

---

## Г7. Использование фич

За что реально платят. Все метрики — в разрезе тарифов; это прямой ответ, какие фичи продают Premium и VIP. Аудитория: продукт + маркетинг.

| Метрика | Тип | Что показывает | Формула | Разрезы | События-источники | Частота |
|---|---|---|---|---|---|---|
| Юзедж фич по тарифам | Ч | Реальное использование каждой фичи | По каждой фиче: доля активных пользователей тарифа, использовавших её за период, и объём использований. Фичи: сообщения, фото, аудио сообщения, видео, звонки, групповые чаты | тариф (Free/Premium/VIP/Legacy), локаль, период 7/30 дней | `chat.message_sent`, `photo.generated`, `audio.sent`, `video.generated`, `call.completed`, `group_chat.message_sent` | день |
| Расход токенов по операциям | Ч | На что уходят токены | Σ `tokens.spent` по операциям, доля каждой | тариф, операция, источник токенов | `tokens.spent` | день |
| Доля исчерпавших транш | Ч | Кому не хватает месячного объёма | Доля платных с балансом тарифных токенов = 0 до конца цикла | тариф, период | `tokens.exhausted` | день |
| Конверсия нехватки токенов | К | Продающая сила отказа операции | Доля получивших `tokens.blocked_action`, купивших пакет или VIP в 72 ч | тариф, операция | `tokens.blocked_action`, `tokens.pack_purchased`, `subscription.upgraded` | день |

## Г8. Юнит-экономика

Не дублируется — единственный источник правды по марже живёт в документе «Токеномика», раздел 13 «Метрики»:

- Себестоимость пользователя за период и маржа тарифа
- Доля убыточных платных (`UNPROFITABLE_SHARE_ALERT`)
- Метрики лестницы: доля Premium, регулярно покупающих пакеты · переходы на VIP против докупки · фактическая цена токена по сегментам
- Доля Legacy в базе и темп её сокращения
- Экономика заморозки: объём замороженных токенов, возвраты с замороженным остатком

## Что дальше

Документ пополняется частями по мере поступления метрик. На основе колонок «События-источники» собирается документ «События» — единая таблица всех событий с полями и потребителями.
</script>
<script>
  const raw = document.getElementById("src").textContent;
  document.getElementById("out").innerHTML = marked.parse(raw, {gfm:true});

(function(){
  const main = document.querySelector("main");
  const toc = document.getElementById("toc");
  const heads = main.querySelectorAll(".md h2, .md h3, .proto-label b");
  let n = 0;
  const t = document.createElement("div"); t.className = "toc-t"; t.textContent = "Оглавление"; toc.appendChild(t);
  const items = [];
  let curSub = null, curParent = null;
  heads.forEach(h => {
    const proto = h.closest(".proto");
    const target = proto || h;
    if (!target.id) target.id = "sec-" + (n++);
    target.style.scrollMarginTop = "70px";
    const a = document.createElement("a");
    a.href = "#" + target.id;
    a.textContent = proto ? "Прототип: " + h.textContent : h.textContent;
    const isChild = (h.tagName === "H3" && !proto);
    if (isChild) {
      a.className = "h3";
      if (!curSub) {
        curSub = document.createElement("div"); curSub.className = "toc-sub";
        toc.appendChild(curSub);
        if (curParent) curParent.sub = curSub;
      }
      curSub.appendChild(a);
      items.push({target, a, parent: curParent});
    } else {
      curSub = null;
      const row = document.createElement("div"); row.className = "toc-row";
      row.appendChild(a); toc.appendChild(row);
      const it = {target, a, row, sub: null, tgl: null};
      curParent = it; items.push(it);
    }
  });
  items.forEach(it => {
    if (it.sub) {
      const b = document.createElement("button"); b.className = "toc-tgl"; b.textContent = "\u25B6";
      b.addEventListener("click", () => {
        const open = it.sub.classList.toggle("open");
        b.classList.toggle("open", open);
      });
      it.row.appendChild(b); it.tgl = b;
    }
  });
  function setOpen(it, open){
    if (it && it.sub){ it.sub.classList.toggle("open", open); it.tgl.classList.toggle("open", open); }
  }
  let lastOwner = null;
  function onScroll(){
    let cur = items[0];
    for (const it of items) {
      if (it.target.getBoundingClientRect().top <= 90) cur = it; else break;
    }
    items.forEach(it => it.a.classList.toggle("active", it === cur));
    const owner = cur ? (cur.parent || cur) : null;
    if (owner !== lastOwner) { setOpen(owner, true); lastOwner = owner; }
  }
  addEventListener("scroll", onScroll, {passive:true}); onScroll();
})();

</script>
</body>
</html>
