# События

Единая таблица событий продукта — контракт между тремя системами: разработка реализует запись, [метрики](metrics.html) читают для расчёта, уведомления подписываются как на триггеры.

Собрана из двух источников: колонки «События-источники» системы метрик и сценарии коммуникаций с пользователями.

## Общие правила

| № | Правило |
|---|---|
| С1 | Событие записывается **сервером в момент факта**. Клиентские события допустимы только для интерфейсных действий и помечены 🖱 |
| С2 | Каждое событие несёт базовый набор: пользователь, **тариф на момент события**, локаль, время. В таблицах ниже эти поля не повторяются |
| С3 | Повторная доставка события **не создаёт дубль** |
| С4 | События, помеченные ⏱ — **производные**: их создаёт планировщик или логика по правилу, а не действие пользователя |
| С5 | Деньги, токены, квоты, подписки — только серверные события. Потерянное клиентское событие — потерянная строка аналитики; потерянное серверное — расхождение денег |
| С6 | Имена событий из этого документа — канонические. Переименование ломает метрики и триггеры одновременно |

Колонка «Метрики» — группы из [системы метрик](metrics.html). Колонка «Уведомления» — сценарий, который будет формализован в документе уведомлений.

---

## Е1. Регистрация и каналы

| Событие | Когда наступает | Ключевые поля | Метрики | Уведомления |
|---|---|---|---|---|
| `auth.signup_completed` | Аккаунт создан | источник, кампания | Г3 | приветствие |
| `auth.email_verified` | Почта подтверждена | — | — | открывает email-канал для всех рассылок |

---

## Е2. Общение и лимиты сообщений

| Событие | Когда наступает | Ключевые поля | Метрики | Уведомления |
|---|---|---|---|---|
| `chat.message_sent` | Сообщение отправлено компаньону | компаньон | Г5, Г6, Г7 | — |
| `quota.message_blocked` | **Стена Free**: сообщение не отправлено, квота 5/мес исчерпана | номер попытки | Г3 | предложение подписки — главный конверсионный триггер |
| `message_limit.reached` | Достигнут дневной лимит: Premium 500/день или скрытый предел VIP | tier: premium / vip | Г5 | premium — предложение VIP; vip — «подождите до завтра», без апсейла |

---

## Е3. Операции контента

| Событие | Когда наступает | Ключевые поля | Метрики | Уведомления |
|---|---|---|---|---|
| `photo.generated` | Фото сгенерировано | компаньон, токенов списано | Г7 | — |
| `audio.sent` | Аудио сообщение отправлено | токенов списано | Г7 | — |
| `video.generated` | Видео сгенерировано (VIP) | токенов списано | Г7 | — |
| `call.completed` | Аудио звонок завершён (VIP) | длительность, токенов списано | Г7 | — |
| `group_chat.message_sent` | Сообщение в групповом чате (VIP) | чат | Г7 | — |
| `operation.failed` | Операция не выполнена: ошибка или таймаут | операция, причина, токенов возвращено | — | «токены возвращены» — возврат обязан произойти до уведомления |

---

## Е4. Токены

| Событие | Когда наступает | Ключевые поля | Метрики | Уведомления |
|---|---|---|---|---|
| `tokens.granted` ⏱ | Начисление: транш тарифа, промо, компенсация | источник (тарифные/бонусные), объём, причина | Г8 | — |
| `tokens.spent` | Списание за операцию | операция, объём, источник списания | Г7, Г8 | — |
| `tokens.pack_purchased` | Пакет куплен | номинал, цена, валюта | Г2 | чек |
| `tokens.blocked_action` | Операция не запущена — не хватает токенов | операция, дефицит | Г7 | предложение пакета, затем VIP — вторая точка продажи |
| `tokens.balance_low` ⏱ | Остаток ниже порога `LOW_BALANCE_THRESHOLD_PCT` | остаток | — | «токены на исходе» |
| `tokens.exhausted` ⏱ | Баланс тарифных токенов достиг нуля | — | Г7 | — |
| `tokens.expiring_soon` ⏱ | До сгорания транша `EXPIRY_WARNING_DAYS` | сгорит объём | — | «остаток сгорит через N дней» — только тарифные |
| `tokens.expired` ⏱ | Транш сгорел в конце цикла | объём | Г8 | — |
| `tokens.frozen` ⏱ | Заморозка при падении на Free / в grace | объём | Г8 | используется в текстах окна восстановления и win-back |
| `tokens.unfrozen` ⏱ | Разморозка при возобновлении подписки | объём | Г8 | — |

---

## Е5. Пробный набор Free

| Событие | Когда наступает | Ключевые поля | Метрики | Уведомления |
|---|---|---|---|---|
| `trial.granted` ⏱ | Welcome-набор выдан | причина: регистрация / даунгрейд, состав, настройка на момент выдачи | Г8 | — |
| `trial.used` | Пробная операция потрачена | операция, осталось проб | Г8 | при остатке 0 — предложение подписки |

## Е6. Чекаут и платежи

| Событие | Когда наступает | Ключевые поля | Метрики | Уведомления |
|---|---|---|---|---|
| `checkout.opened` 🖱 | Клик «Получить тариф» | тариф, период, **точка входа**: карточка / стена Free / стена Premium / нехватка токенов / VIP-плашка | Г4 | — |
| `payment_method.selected` 🖱 | Выбран способ оплаты | способ, валюта | Г4 | — |
| `checkout.started` | Платёж передан в шлюз | способ, провайдер, валюта, сумма | Г4 | — |
| `checkout.abandoned` ⏱ | Нет оплаты за 60 мин после открытия чекаута | шаг отвала | Г4 | брошенная корзина |
| `payment.succeeded` | Платёж успешен | сумма, валюта, провайдер, способ, тип: подписка / пакет / апгрейд, рекуррентный ли | Г2, Г3, Г4, Г5 | чек; для апгрейда — «VIP включён» |
| `payment.failed` | Платёж отклонён | `decline_code`, провайдер, способ, номер попытки, рекуррентный ли | Г4 | причина по коду + предложение другого способа; при апгрейде подписка не затрагивается |
| `payment.retry_exhausted` ⏱ | Попытки списания исчерпаны — день 4 окна восстановления | — | Г5 | «переключены на бесплатный тариф, токены заморожены» |

---

## Е7. Подписка — переходы состояний

| Событие | Когда наступает | Ключевые поля | Метрики | Уведомления |
|---|---|---|---|---|
| `subscription.started` | Первая оплата, подписка открыта | тариф, период, способ | Г3, Г5, Г6 | приветствие платного |
| `subscription.renewal_due` ⏱ | Подписка подлежит продлению | тариф, период, способ, дата списания | Г5 | карта: напоминание для 3 мес / 1 год; **крипта: напоминание о ручном продлении — без него отток 100%** |
| `subscription.renewed` | Продление прошло | тариф, период | Г5 | чек |
| `subscription.past_due_started` ⏱ | День 0: списание не прошло, доступ полный | — | — | «не смогли списать, всё работает до завтра» |
| `subscription.grace_started` ⏱ | День 1: платные функции отключены | заморожено токенов | — | «лимит снова 5/мес, всё вернём после оплаты, осталось 3 дня» |
| `subscription.expired` ⏱ | Подписка закрыта | причина: неоплата / отмена / возврат | Г5 | — |
| `subscription.reverted_to_free` ⏱ | Переключён на Free — день 4 или конец отменённого периода | заморожено токенов | Г8 | win-back серия: «N токенов заморожено и ждёт» |
| `subscription.reactivated` | Вернулся на платный после перерыва | тариф, дней отсутствия | Г8 | «токены разморожены» |
| `subscription.cancelled` | Автопродление выключено пользователем | причина, доступ до | — | подтверждение с датой окончания и судьбой токенов |
| `subscription.upgraded` | Переход на старший тариф | из, в, доплата с зачётом | Г5, Г7 | «VIP включён» |
| `subscription.downgraded` | Переход на младший — со следующего цикла | из, в, дата вступления | Г5 | подтверждение |

---

## Е8. Интерфейсные точки продажи

| Событие | Когда наступает | Ключевые поля | Метрики | Уведомления |
|---|---|---|---|---|
| `vip_feature.clicked` 🖱 | Клик по функции с плашкой VIP | функция | — | экран апгрейда с расчётом доплаты; фиксирует, какие VIP-функции продают |
| `paywall.shown` 🖱 | Показано предложение подписки / пакета / VIP | причина показа: стена Free / стена Premium / нехватка токенов / VIP-функция / проба исчерпана | — | знаменатель конверсии всех точек продажи |

## Внешние источники

Не продуктовые события — метрики Г1 и знаменатели Г3 читаются напрямую из систем:

| Источник | Что даёт | Метрики |
|---|---|---|
| Я.Метрика | Визиты, гео, каналы, рефереры | Г1 |
| Keitaro | Клики, кампании | Г1, Г3 |

<script>
  const raw = document.getElementById("src").textContent;
  document.getElementById("out").innerHTML = marked.parse(raw, {gfm:true});

  document.querySelectorAll("#out table").forEach(tb => {
    const heads = [...tb.querySelectorAll("th")].map(th => th.textContent.trim());
    const cutIdx = heads.indexOf("Разрезы");
    let evIdx = heads.indexOf("События-источники");
    if (evIdx < 0) evIdx = heads.indexOf("Источник");
    tb.querySelectorAll("tr").forEach(tr => {
      const tds = tr.children;
      if (cutIdx >= 0 && tds[cutIdx] && tds[cutIdx].tagName === "TD") {
        const txt = tds[cutIdx].textContent.trim();
        if (txt && txt !== "—")
          tds[cutIdx].innerHTML = txt.split(",").map(p => '<span class="chip-cut">' + p.trim() + "</span>").join("");
      }
      if (evIdx >= 0 && tds[evIdx] && tds[evIdx].tagName === "TD") {
        tds[evIdx].innerHTML = tds[evIdx].innerHTML
          .replace(/Keitaro/g, '<span class="chip-ext">Keitaro</span>')
          .replace(/Я\.Метрика/g, '<span class="chip-ext">Я.Метрика</span>');
      }
    });
  });


(function(){
  const main = document.querySelector("main");
  const toc = document.getElementById("toc");
  const heads = main.querySelectorAll(".md h2, .md h3, .proto-label b");
  let n = 0;
  const t = document.createElement("div"); t.className = "toc-t"; t.textContent = "Оглавление"; toc.appendChild(t);
  const items = [];
  let curSub = null, curParent = null;
  heads.forEach(h => {
    const proto = h.closest(".proto");
    const target = proto || h;
    if (!target.id) target.id = "sec-" + (n++);
    target.style.scrollMarginTop = "70px";
    const a = document.createElement("a");
    a.href = "#" + target.id;
    a.textContent = proto ? "Прототип: " + h.textContent : h.textContent;
    const isChild = (h.tagName === "H3" && !proto);
    if (isChild) {
      a.className = "h3";
      if (!curSub) {
        curSub = document.createElement("div"); curSub.className = "toc-sub";
        toc.appendChild(curSub);
        if (curParent) curParent.sub = curSub;
      }
      curSub.appendChild(a);
      items.push({target, a, parent: curParent});
    } else {
      curSub = null;
      const row = document.createElement("div"); row.className = "toc-row";
      row.appendChild(a); toc.appendChild(row);
      const it = {target, a, row, sub: null, tgl: null};
      curParent = it; items.push(it);
    }
  });
  items.forEach(it => {
    if (it.sub) {
      const b = document.createElement("button"); b.className = "toc-tgl"; b.textContent = "\u25B6";
      b.addEventListener("click", () => {
        const open = it.sub.classList.toggle("open");
        b.classList.toggle("open", open);
      });
      it.row.appendChild(b); it.tgl = b;
    }
  });
  function setOpen(it, open){
    if (it && it.sub){ it.sub.classList.toggle("open", open); it.tgl.classList.toggle("open", open); }
  }
  let lastOwner = null;
  function onScroll(){
    let cur = items[0];
    for (const it of items) {
      if (it.target.getBoundingClientRect().top <= 90) cur = it; else break;
    }
    items.forEach(it => it.a.classList.toggle("active", it === cur));
    const owner = cur ? (cur.parent || cur) : null;
    if (owner !== lastOwner) { setOpen(owner, true); lastOwner = owner; }
  }
  addEventListener("scroll", onScroll, {passive:true}); onScroll();
})();

</script>
