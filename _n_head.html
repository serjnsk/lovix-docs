<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lovix — Сценарии взаимодействия</title>
<style>
  :root{
    --text:#1c2330; --muted:#5b6474; --dim:#8b93a5;
    --line:#e3e6ec; --line2:#c9cedb;
    --bg-band:#f6f7fa; --card:#ffffff;
    --accent:#2f54c9; --accent-bg:#eef2fd;
    --ok:#1a7f4e; --ok-bg:#e8f5ee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--text);
    font:15.5px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif}
  .top{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
  .top-in{max-width:1080px;margin:0 auto;padding:14px 28px;display:flex;justify-content:space-between;align-items:baseline}
  .top b{font-size:17px}
  .top nav a{color:var(--muted);text-decoration:none;font-size:13.5px;margin-left:18px}
  .top nav a:hover{color:#000}
  .top nav a.cur{color:var(--accent);font-weight:700}
  main{max-width:1080px;margin:0 auto;padding:12px 28px 90px}
  .md h1{font-size:32px;letter-spacing:-.4px;margin:34px 0 6px}
  .md h2{font-size:22px;margin:46px 0 12px;padding-top:22px;border-top:1px solid var(--line);letter-spacing:-.2px}
  .md h3{font-size:16.5px;margin:28px 0 8px}
  .md p{margin:10px 0}
  .md strong{color:#000}
  .md table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13.5px;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  .md th{background:var(--bg-band);white-space:nowrap}
  .md tr:nth-child(even) td{background:#fafbfc}
  .md code{background:var(--bg-band);border:1px solid var(--line);border-radius:5px;padding:1px 6px;
    font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:#8a3ffc}
  .md pre{background:var(--bg-band);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto}
  .md pre code{background:none;border:0;padding:0;color:#333}
  .md blockquote{margin:14px 0;padding:12px 18px;border-left:3px solid var(--accent);
    background:var(--accent-bg);border-radius:0 8px 8px 0;color:#37415a}
  .md ul,.md ol{padding-left:24px}
  .md a{color:var(--accent)}
  .md table code{background:var(--accent-bg);color:var(--accent);border:1px solid #d6def8;
    border-radius:6px;padding:2px 7px;font-size:11.5px;white-space:nowrap;display:inline-block;margin:1px 2px}
  .chip-cut{display:inline-block;font-size:11.5px;background:var(--bg-band);color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin:1px 3px 1px 0;white-space:nowrap}
  .chip-ext{display:inline-block;font-size:11.5px;background:#fef3e2;color:#b45309;
    border:1px solid #f3ddba;border-radius:6px;padding:2px 7px;margin:1px 2px;white-space:nowrap}


  html{scroll-behavior:smooth}
  .layout{max-width:1340px;margin:0 auto;display:flex;align-items:flex-start}
  aside.toc{position:sticky;top:58px;width:272px;flex:0 0 272px;max-height:calc(100vh - 70px);
    overflow-y:auto;padding:26px 14px 26px 24px;font-size:13px}
  aside.toc .toc-t{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
    color:var(--dim);margin:0 0 10px 10px}
  aside.toc a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:7px;line-height:1.35}
  aside.toc a:hover{color:#000;background:var(--bg-band)}
  aside.toc a.h3{padding-left:26px;font-size:12.5px;color:var(--dim)}
  aside.toc a.active{color:var(--accent);background:var(--accent-bg);font-weight:600}
  aside.toc .toc-row{display:flex;align-items:center;gap:2px}
  aside.toc .toc-row a{flex:1}
  aside.toc .toc-tgl{border:0;background:none;color:var(--dim);cursor:pointer;width:22px;height:22px;
    border-radius:6px;font-size:9px;display:flex;align-items:center;justify-content:center;
    transition:transform .15s;flex:0 0 auto}
  aside.toc .toc-tgl:hover{background:var(--bg-band);color:#000}
  aside.toc .toc-tgl.open{transform:rotate(90deg)}
  aside.toc .toc-sub{display:none}
  aside.toc .toc-sub.open{display:block}
  .fun{max-width:680px;margin:20px auto 26px}
  .fstep{position:relative;margin:0 auto 4px;border-radius:10px;background:var(--accent);color:#fff;
    padding:11px 16px;font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;
    align-items:center;flex-wrap:wrap;gap:6px}
  .fstep code{background:rgba(255,255,255,.16);border:0;color:#fff;font-size:11px;padding:2px 7px;border-radius:5px}
  .fs1{width:100%}.fs2{width:84%;opacity:.93}.fs3{width:70%;opacity:.86}.fs4{width:56%;opacity:.8}
  .fconv{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--muted);font-size:12px;padding:3px 0}
  .fconv b{color:var(--ok);background:var(--ok-bg);border-radius:999px;padding:2px 10px;font-size:11.5px;white-space:nowrap}
  .fbranch{position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%);white-space:nowrap;
    font-size:11.5px;color:#b91c1c;background:#fdecec;border:1px solid #f5caca;border-radius:8px;padding:4px 10px;font-weight:600}
  .fbranch.wrm{color:#b45309;background:#fef3e2;border-color:#f3ddba}
  .fbranch small{display:block;color:var(--muted);font-weight:400;font-size:10.5px}
  .fnote{margin-top:12px;text-align:center;color:var(--dim);font-size:12px}
  @media(max-width:980px){.fbranch{position:static;transform:none;display:inline-block}}


  main{flex:1;min-width:0}
  @media(max-width:1080px){aside.toc{display:none}}
</style>
</head>
<body>
<div class="top"><div class="top-in">

</div></div>
<div class="layout"><aside class="toc" id="toc"></aside>
<main style="padding:12px 28px 90px"><div class="md" id="out"></div></main></div>
