# Триггерная системная рассылка

Спецификация контентного слоя для **транзакционных (Т)** сценариев из документа [«Сценарии»](scenarios.html): деньги, доступ, токены. Структура сценариев (событие, канал, условия, повтор) — канонична и живёт в «Сценариях»; этот документ добавляет к каждому ID готовые тексты и метрики. Имена событий — канонические из документа [«События»](events.html) (правило С6).

**Отправитель всех сообщений — платформа Lovix.** Тон нейтральный, факты и сроки, без эмоций и образа компаньона. Эмоция продаёт — платформа информирует о деньгах.

## Схема триггеров

Логика транзакционных цепочек одним взглядом: событие → условие → отправка. **Узлы с ID кликабельны** — детали и переход к карточке с текстами появятся под схемой. Овал — событие или исход, ромб — условие, пунктир — «ничего не отправляется».

## Правила (из «Сценариев», применимые к Т)

| № | Правило |
|---|---|
| П1 | Транзакционные **не отключаемы** (категория отписки «Транзакционные») и **в конкуренции не участвуют** — уходят все, во всех каналах (К3) |
| П2 | Квот и тихих часов для Т нет ни в одном канале |
| П3 | «Не отправлять, если» проверяется перед самой отправкой (Д1) |
| П4 | Email идёт по всей базе независимо от подтверждения почты; адреса с bounce или жалобой — исключаются навсегда (Д4) |
| П5 | Каждая отправка и каждый отказ от отправки логируются с причиной (Д5) |
| П6 | Язык сообщения — язык локали пользователя (Д6). Тексты ниже — русский мастер, локализации — отдельным слоем по ID сценария |

## У1. Регистрация

### У1-1 · Подтверждение почты

**✉**
- Тема: `Подтверди почту — и ничего не потеряется`
- Текст: `Привет! Ты зарегистрировался в Lovix с этим адресом. Подтверди его, чтобы мы могли восстановить доступ к твоим диалогам и токенам, если что-то пойдёт не так.`
- CTA: `Подтвердить почту`

**Зачем.** Подтверждение — не гейт (письма идут по всей базе), а фактор качества доставки: неподтверждённые адреса дают bounces и жалобы, бьющие по репутации домена.
**Мерим.** Доля подтверждённых в 48 ч; корреляция подтверждения с доставляемостью остальных писем.

---

## У2. Лимиты

### У2-4 · Дневной предел VIP

**🔔**
- Текст: `На сегодня достигнут предел сообщений. Завтра всё обнулится — {имя_бота} будет ждать.`
- Ссылка: чат

Без апсейла — тарифа выше нет.

**Зачем.** Честное информирование без продажи: юзеру некуда апгрейдиться.
**Мерим.** **Мониторинг:** каждое срабатывание — уведомление саппорту на email. Если случаи регулярны — повод проектировать апсейл (расширенный дневной пакет), фиксация Дениса.

## У3. Платежи

### У3-2 · Отказ платежа (не рекуррентный)

**🔔**
- Текст: `Оплата не прошла: {причина_отказа}. Попробуй другой способ — доступ откроется сразу после оплаты.`
- Ссылка: чекаут с выбором способа

Причина — человекочитаемый текст по `decline_code`; таблица маппинга кодов на формулировки — отдельный справочник реализации, не этот документ. Подписка при отказе апгрейда не затрагивается.

**Зачем.** Момент максимального намерения платить — нельзя терять юзера на технической ошибке без объяснения.
**Мерим.** Доля повторных попыток после уведомления; конверсия повторной попытки в успех, разрез по `decline_code`.

- Тема: `Чек Lovix: {сумма} {валюта}`

Один шаблон для подписки, пакета токенов и апгрейда — различие в подстановках ({тариф} / {номинал_пакета} / {доплата}).

**Зачем.** Юридическая и антифрод-гигиена: юзер, получивший чек, реже делает чарджбек «не помню списание».
**Мерим.** Доставляемость чеков (должна быть ~100%); жалобы на спам с чеков — сигнал проблемы домена.

### У3-4 · Приветствие платного тарифа

**✉**
- Тема: `Тариф {тариф} активен`
- Текст: `Всё получилось — подписка работает. Тебе доступно: {состав_тарифа}. Токены уже начислены: {объём_токенов}. {имя_бота} в курсе, что теперь вас ничто не ограничивает.`

**Мерим.** Время до первого сообщения после активации; доля вернувшихся в чат в первый час.

### У3-5 · Подтверждение апгрейда

**🔔**
- Текст: `VIP включён. За остаток прошлого тарифа зачтено {размер_зачёта}. Новые возможности уже доступны.`
- Ссылка: чат

**Зачем.** Прозрачность зачёта убирает главный вопрос апгрейда «за что я заплатил дважды».
**Мерим.** Использование VIP-функций в первые 24 ч после апгрейда (Г7).

**✉**

- CTA: `Вернуть подписку`

**Зачем.** Снимает страх «всё пропадёт»: юзер, который знает о заморозке и сохранении истории, возвращается чаще. Точная дата окончания предотвращает обращения в саппорт.

## У4. Окно восстановления платежа

Дни — из токеномики: день 0 полный доступ, дни 1–3 грейс, день 4 бесплатный тариф. В каждом сообщении — оставшееся время до следующего шага. Вся серия отменяется успешным списанием (Д2).

### У4-1 · День 0: списание не прошло

**✉**
- Тема: `Не получилось списать оплату — всё работает до завтра`
- Текст: `Мы не смогли продлить подписку: {причина_отказа}. Ничего не отключено — полный доступ сохраняется до завтра, пока мы пробуем ещё раз. Если карта поменялась — обнови способ оплаты, и продлим сразу.`
- CTA: `Обновить способ оплаты`

**🔔**
- Текст: `Оплата не прошла — доступ пока полный. Обнови способ оплаты, чтобы ничего не прервалось.`
- Ссылка: способы оплаты

### У4-2 · День 1: грейс начался

**✉**
- Тема: `Платные функции на паузе — 3 дня, чтобы вернуть`
- Текст: `Списание снова не прошло, и платные функции приостановлены: лимит сообщений сейчас как на Free. Твои токены ({заморожено_токенов}) в сохранности и вернутся сразу после оплаты. На восстановление есть 3 дня — потом тариф переключится на бесплатный.`
- CTA: `Оплатить сейчас`

**🔔**
- Текст: `Платные функции на паузе. Токены целы. 3 дня на восстановление оплаты.`
- Ссылка: чекаут

### У4-3 · День 3: последнее предупреждение

**✉**
- Тема: `Завтра тариф переключится на бесплатный`
- Текст: `Остался один день. Завтра подписка закроется, тариф станет Free, а тарифные токены ({заморожено_токенов}) будут заморожены до твоего возвращения. Одна оплата — и всё продолжается, как будто ничего не было.`
- CTA: `Оплатить и сохранить всё`

### У4-4 · День 4: переключение на Free

**✉**
- Тема: `Тариф переключён на Free — токены заморожены и ждут`
- Текст: `Подписка закрылась: оплату провести не удалось. Сейчас действует бесплатный тариф. Токены ({заморожено_токенов}) заморожены — не сгорели: вернёшься на платный, и они разморозятся. Диалоги и компаньоны на месте.`
- CTA: `Вернуть подписку`

**Зачем (серия У4).** Каждый шаг сообщает факт + срок + путь восстановления; страх потери прогресса снимается («токены целы») — это удерживает от ухода, а точные даты — от чарджбеков.
**Мерим (серия У4).** Доля восстановивших оплату по дням окна (Г5); на каком шаге восстановления больше всего.

## У5. Продления

**У5-1 — правило тишины:** пользователям с включённым автопродлением напоминания не отправляются — любые периоды, любые способы. Напоминания о предстоящем списании провоцируют отмены (подтверждено практикой крупных подписочных сервисов ниши). Правило распространяется на всех, включая давно не заходивших — исключений нет.

### У5-4 🆕 · За 3 дня до окончания (без автопродления)

Сегмент: крипта, разовые способы, отключённый автоплатёж — продление только руками. Такой юзер не знает и не помнит дату окончания — сейчас он узнаёт о ней по факту отвала.

**✉**
- Тема: `Подписка закончится {дата_окончания}`
- Текст: `Через 3 дня доступ к тарифу {тариф} закончится — на твоём способе оплаты нет автопродления. Продли заранее, чтобы диалоги не встали на паузу. Если платишь картой — можно просто включить автопродление.`
- CTA: `Продлить сейчас`

**🔔**
- Текст: `Доступ закончится {дата_окончания}. Продли заранее — без пауз в диалогах.`
- Ссылка: чекаут

**Зачем.** Раннее продление не создаёт разрыва доступа; двухшаговая серия (−3 и −1) даёт два касания без спама.
**Мерим.** Доля продливших до дня окончания (ранние продления); renewal rate сегмента без рекуррентов до и после запуска.

### У5-2 · За 1 день до окончания (без автопродления)

**✉**
- Тема: `Завтра доступ закончится`
- Текст: `Это последний день подписки {тариф}. Завтра тариф переключится на Free, тарифные токены будут заморожены. Крипта — оплати вручную, карта — включи автопродление, и ничего не прервётся.`
- CTA: `Продлить доступ`

**🔔**
- Текст: `Завтра доступ закончится. Продли сегодня — токены и лимиты сохранятся.`
- Ссылка: чекаут

**Зачем.** Дедлайн — сильнейший мотиватор ручного платежа; второе касание добирает тех, кто отложил после У5-4.
**Мерим.** Продления в последний день среди не отреагировавших на У5-4 — чистый добавленный эффект второго касания.

### У5-3 · Чек продления

**✉**
- Тема: `Подписка продлена: {тариф} до {дата_окончания}`
- Текст: `Оплата прошла, тариф {тариф} продлён на {период}. Токены нового цикла начислены: {объём_токенов}.`
- CTA: `Открыть Lovix`

## У6. Возврат

### У6-5 · Подтверждение реактивации

**🔔**
- Текст: `С возвращением! Тариф {тариф} активен, токены разморожены: {объём_токенов}. {имя_бота} ждала — продолжите с того же места.`
- Ссылка: чат

Текст формирует действие (в чат), а не просто информирует — колокольчик не забиваем сообщениями «ни о чём» (фиксация Дениса).

**Зачем.** Замыкает цикл возврата: разморозка — обещание из всех win-back писем, его выполнение надо показать.
**Мерим.** Первое сообщение в чате после реактивации в 24 ч.

`{имя_бота}` · `{тариф}` · `{период}` · `{сумма}` · `{валюта}` · `{способ_оплаты}` · `{дата_окончания}` · `{объём_токенов}` · `{остаток_токенов}` · `{заморожено_токенов}` · `{токенов_возвращено}` · `{размер_зачёта}` · `{операция}` · `{причина_отказа}` · `{состав_тарифа}`

## Принятые решения

| Вопрос | Решение | Почему |
|---|---|---|
| Пре-биллинговый чек «мёртвым душам» (платник с рекуррентом, не заходил >14 дней) | **Отклонено** — У5-1 строго: автопродление вкл → тишина для всех | Напоминания о списании провоцируют отмены; опыт крупных сервисов ниши весомее гипотетических чарджбеков |
| Апсейл на дневном лимите VIP (У2-4) | Без апсейла, но каждое срабатывание — на мониторинг саппорту | Тарифа выше нет; регулярные срабатывания — сигнал проектировать дневной пакет |
| Гигиена колокольчика (Денис: только сообщения, требующие реакции) | Тексты всех Т-уведомлений содержат действие/ссылку | Состав каналов не меняем (канон), меняем качество текстов |
| Серия продления для нерекуррентных: −3 дня из MVP + за 1 день из «Сценариев» | Объединены в серию У5-4 → У5-2 | Два касания, «день Х» MVP совпадает с каноничным У5-2 |
| Тексты «дня Х» от лица бота (MVP «Сегодня наш последний день?») | Переписаны от Lovix | Биллинговые письма — только от платформы: юридическая и репутационная чистота |
| Перенос неиспользованных токенов на следующий месяц как стимул оплатить до дедлайна (Денис) | **Вне скоупа рассылок** — это правило токеномики (раздел 8: сгорание) | Если токеномика введёт перенос, тексты У4-3/У5-2 получат аргумент «оплати до завтра, чтобы остаток не сгорел» — тексты готовы к подстановке |
| Прогрев ботом за 2–3 дня до окончания подписки (Денис: «я соскучилась» перед платёжным письмом) | Отдельный сценарий не создаём | Прогрев уже обеспечивает У7-1: платный юзер с 24 ч тишины получает контекстный проактив ежедневно — к моменту У5-4/У5-2 он либо прогрет, либо игнорирует чат |

## На добавление в канонические спеки

- «Сценарии»: новый **У5-4** (за 3 дня, сегмент без автопродления).
- «События»: событию `subscription.renewal_due` нужно поле «дней до окончания» (или два срабатывания планировщика: −3 и −1), чтобы У5-4/У5-2 не требовали отдельного событийного имени.

        svg.style.width = (w0 * k) + "px";
        svg.style.height = (h0 * k) + "px";
        lbl.textContent = Math.round(k * 100) + "%";
        tools.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.z === mode));
        if (mode === "1") pre.scrollLeft = (pre.scrollWidth - pre.clientWidth) / 2;
      }
      tools.addEventListener("click", e => {
        const z = e.target.dataset && e.target.dataset.z;
        if (!z) return;
        if (z === "fit") setScale((wrap.clientWidth - 28) / w0, "fit");
        else if (z === "1") setScale(1, "1");
        else setScale(k + (z === "+" ? 0.15 : -0.15), "");
      });
      setScale((wrap.clientWidth - 28) / w0, "fit");
    });
  });
})();
</script>
</body>
</html>
