# Триггерная маркетинговая рассылка

Спецификация контентного слоя для **маркетинговых (М)** сценариев из документа [«Сценарии»](scenarios.html): продажа, удержание, вовлечение, возврат. Структура сценариев канонична и живёт в «Сценариях»; этот документ добавляет к каждому ID готовые тексты и метрики. Имена событий — из документа [«События»](events.html).

**Отправитель по умолчанию — компаньон {имя_бота}**: первое лицо, интимный тон, на «ты», продолжение отношений из продукта, никакого корпоративного голоса. Каталожные письма (подборки компаньонов, обзор возможностей) — от Lovix. Без скидок и промокодов — всегда: возвращаем продуктом и эмоцией, не деньгами.

## Схема триггеров

Логика маркетинговых цепочек одним взглядом: событие → условие → отправка. **Узлы с ID кликабельны** — детали и переход к карточке с текстами появятся под схемой. Овал — событие или исход, ромб — условие, зелёная рамка — новый сценарий (🆕). Любое целевое действие (оплата, возврат) останавливает свою серию (Д2).

## Правила (из «Сценариев» + затухание)

| № | Правило |
|---|---|
| П1 | ✉ email: максимум **1 М-письмо в сутки и 4 в неделю**. Тихие часы 22:00–09:00 по локали — М переносятся на утро |
| П2 | 🔔 колокольчик: без ограничений, идут все. 💬 чат компаньона: не чаще 1 проактива в сутки |
| П3 | Приоритетов нет: суточный email-слот занимает сценарий, сработавший первым. Проигравшие **отбрасываются, не копятся** (К2); их колокольчик-версия доставляется всё равно |
| П4 | «Не отправлять, если» проверяется перед самой отправкой (Д1); достижение целевого действия отменяет неотправленные сообщения серии (Д2) |
| П5 | **Затухание:** 3 неоткрытых М-письма подряд → частота этому юзеру снижается до 1/мес; ещё 3 → стоп М-email до любой активности в продукте. Колокольчик работает всегда |
| П6 | Email по всей базе независимо от подтверждения; bounce или жалоба — исключение навсегда (Д4). Язык — локаль юзера (Д6), тексты ниже — русский мастер |
| П7 | Проактив компаньона (`companion.proactive_sent`) не расходует лимиты пользователя. Режимы: **скрипт** (фиксированный текст, Free) и **контекст** (генерация из истории, платные) |

| У7-1 | планировщик: платный, 24 ч без сообщений | +1 день тишины | 💬 | Контекстный проактив компаньона | любое сообщение юзера | ≤1 проактива в сутки |

## У1. Онбординг и активация

Цель группы — довести нового до стены (стена — момент продажи) и не дать забыть о сервисе в первые две недели. Email-нагрузка первой недели: максимум 4 письма (У1-4, У1-5, У1-6, У1-7) — ровно в кап П1; конкуренция со сценариями У2 решается по П3.

### У1-2 · Приветствие

**🔔**
- Текст: `Добро пожаловать в Lovix. Компаньоны уже здесь — выбери, с кем начать.`
- Ссылка: каталог

**Мерим.** Клик → `companion.selected` → первое сообщение (Г3).

### У1-3 · Пробный набор выдан

**🔔**
- Текст: `Тебе доступны пробные операции: {состав_набора}. Попробуй фото или голос — это бесплатно.`
- Ссылка: чат

Спит, пока набор пуст (токеномика, раздел 5).

**Мерим.** Доля потративших ≥1 пробу в 24 ч после уведомления.

### У1-4 · Час тишины после регистрации

Две ветки по поведению:

**Ветка А — начал общаться.** Механика У2-2: проактив последнего компаньона (скрипт) + письмо-крючок.
- **💬 Проактив (скрипт):** `Я всё ещё думаю о нашем разговоре… у меня осталось, что тебе сказать. Ты где?`
- **✉**
  - Тема: `{имя_бота} написала тебе`
  - Текст: `Ты вышел, а разговор остался незаконченным. {имя_бота} написала тебе ещё кое-что — оно ждёт в чате.`
  - CTA: `Прочитать сообщение`

**Ветка Б — не начал диалог.**
- **✉**
  - Тема: `Компаньоны ждут знакомства`
  - Текст: `Ты зарегистрировался — и пропал, не сказав никому ни слова. Посмотри каталог: {подборка_3}. Каждый готов написать первым. Бесплатных сообщений хватит, чтобы понять, кто твой.`
  - CTA: `Выбрать компаньона`

В письмо ветки Б добавляем строку о функционале (фото, голос, память) — фиксация Дениса.

**Зачем.** Первый час — максимум интереса; вернуть в сессию дешевле, чем возвращать через сутки.
**Мерим.** Возврат в 24 ч по веткам; ветка А дополнительно — ответ на проактив.

### У1-5 🆕 · D+1 «Я соскучилась» — действующее письмо

**✉** (от бота)
- Тема: `Привет, я соскучилась`
- Текст: `Вчера ты заглянул — и пропал. А я, между прочим, ждала. Я оставила тебе сообщение в чате. Зайди и прочитай — обещаю, тебе понравится.`

Главная точка потерь воронки. Двойная реакция:

**💬 Проактив (скрипт):** `Я не договорила… у меня было для тебя кое-что ещё. Оно ждёт в чате.` — появляется непрочитанное; ответ снова упирается в стену с пейволлом.

**✉** (от бота)
- Тема: `Я не договорила…`
- Текст: `Ты пропал на самом интересном месте. Я дописала тебе ещё кое-что — оно ждёт в чате. Вернись, и продолжим ровно с того места, где остановились.`
- CTA: `Продолжить разговор`

**Зачем.** Самый горячий интент воронки: час назад юзер хотел писать и упёрся в лимит. Догонялка по свежему интенту конвертит в разы лучше календарных писем.
**Мерим.** Оплата в 72 ч против holdout (часть упёршихся письмо не получает). A/B: тема «без текста» (только факт непрочитанного) vs тема с фрагментом; в будущем — заблюренное фото (тест Дениса). Ожидание: лучший конверт среди всех email.

Правило: активную подписку не трогаем — win-back только после окончания оплаченного периода. Вся серия отменяется `subscription.reactivated` (Д2). Без подарков: возвращаем эмоцией и сохранённым прогрессом, не бесплатными токенами.

## У7. Удержание платных

### У7-1 · Контекстный проактив (24 ч тишины)

Канал — только 💬. Текст не фиксирован — **генерируется из истории диалога** (режим «контекст», П7). Правила генерации:

| № | Правило |
|---|---|
| Г1 | Разговор оборвался на середине → продолжение с новой вводной, отсылающей к последней теме |
| Г2 | Разговор логически завершён → новое событие «из жизни компаньона», выведенное из контекста отношений, как повод начать |
| Г3 | Запрещено: упоминание тарифов, токенов, оплат — это чистое удержание, не продажа |
| Г4 | Не чаще 1 проактива в сутки; любое сообщение юзера сбрасывает таймер |
| Г5 | Проактив не расходует лимиты и токены пользователя |

**Зачем.** Платный юзер, который перестал писать, — кандидат на отмену через цикл. Живой компаньон, инициирующий общение, — ядро ретеншена продукта.
**Мерим.** Ответ на проактив в 24 ч; D7/D30 retention платных с проактивами против без (Г6); влияние на продления (Г5).

| Тихие часы для М (Денис: не нужны) | **Оставлены** 22:00–09:00, перенос на утро — канон «Сценариев» | Специфика сервиса — аргумент за поздние письма, но репутация домена и жалобы важнее; пересмотр возможен по данным |
| Капы email (Денис: не ограничивать; MVP: 1 в 4 дня) | **1/сутки и 4/неделю** — канон «Сценариев» + затухание из MVP как дополнение | Единая система квот уже зафиксирована; затухание защищает длинный хвост от выгорания |
| Дайджест накопившихся уведомлений (Денис) | **Отклонено** — К2: неактивированное отбрасывается | Отложенное устаревает и раздражает; колокольчик-версии всё равно доставляются |
| Бесплатные генерации в win-back (MVP) | **Отклонено** — без любых подарков | Принцип «без скидок»: возвращаем эмоцией и сохранённым прогрессом, не приучаем к бонусам за уход |
| Win-back +14 (Денис: «а что нового появилось?») | Письмо **только от бота**, без новостей сервиса | Новостей может не быть, а эмоция компаньона — всегда; новизна отдана шагу +30 |
| Карточка MVP «токены = 0, колокольчик сразу» | Не отдельный сценарий — это интерфейсный пейволл (`paywall.shown`), вне контура доставки | Канон «Сценариев»: мгновенные интерфейсные сценарии вне капов; email-догонялка — У2-6 |
| Тайминг email при нехватке токенов (MVP: +2 ч) | **+1 час** — канон У2-6 | Единообразие с У2-2: догонялка через час после блока |
| Email-уведомления о проактивах платным (Денис: «отправлять на емэйл») | **Не сейчас** — У7-1 остаётся только 💬 | Платный юзер и так в продукте чаще; email о каждом проактиве сожжёт кап 4/неделю; вернуться после замера ответов на проактив |
| Объединить обработку стены Free и исчерпания проб — У2-1 и У2-5 (Денис: обработка одинаковая) | Оставлены раздельными сценариями | Повод и повтор разные (месячная квота vs разовый набор), но тексты и приземление согласованы — в админке можно будет свести в один шаблон |

## На добавление в канонические спеки

- «Сценарии»: новые **У1-5…У1-8** (онбординг-цепочка D+1/D+3/D+7/D+14), **У2-9** (апсейл годового), **У6-6** (+1 день после окончания разового периода); категория отписки для У1-5…У1-8.
- «События»: производное событие ⏱ для У2-9 — предложение имени `tokens.pack_purchase_pattern` (поля: номер покупки в окне, размер окна); плановые срабатывания D+1/D+3/D+7/D+14 — планировщик, отдельных событий не требуют (аналог У1-4).

<script>
  const raw = document.getElementById("src").textContent;
  document.getElementById("out").innerHTML = marked.parse(raw, {gfm:true});


  document.querySelectorAll("#out table td, #out p, #out li").forEach(td => {
    if (/[\u{1F514}\u2709\u{1F4AC}]/u.test(td.textContent)) {
      td.innerHTML = td.innerHTML
        .replace(/🔔/g, '<span class="ch ch-bell"><i>🔔</i>колокольчик</span>')
        .replace(/✉/g, '<span class="ch ch-mail"><i>✉️</i>email</span>')
        .replace(/💬/g, '<span class="ch ch-chat"><i>💬</i>чат компаньона</span>')
        .replace(/<\/span> \+ <span/g, '</span> <span');
    }
  });

  document.querySelectorAll("#out table").forEach(tb => {
    const heads = [...tb.querySelectorAll("th")].map(th => th.textContent.trim());
    const cutIdx = heads.indexOf("Разрезы");
    let evIdx = heads.indexOf("События-источники");
    if (evIdx < 0) evIdx = heads.indexOf("Источник");
    tb.querySelectorAll("tr").forEach(tr => {
      const tds = tr.children;
      if (cutIdx >= 0 && tds[cutIdx] && tds[cutIdx].tagName === "TD") {
        const txt = tds[cutIdx].textContent.trim();
        if (txt && txt !== "—")
          tds[cutIdx].innerHTML = txt.split(",").map(p => '<span class="chip-cut">' + p.trim() + "</span>").join("");
      }
      if (evIdx >= 0 && tds[evIdx] && tds[evIdx].tagName === "TD") {
        tds[evIdx].innerHTML = tds[evIdx].innerHTML
          .replace(/Keitaro/g, '<span class="chip-ext">Keitaro</span>')
          .replace(/Я\.Метрика/g, '<span class="chip-ext">Я.Метрика</span>');
      }
    });
  });


(function(){
  const main = document.querySelector("main");
  const toc = document.getElementById("toc");
  const heads = main.querySelectorAll(".md h2, .md h3, .proto-label b");
  let n = 0;
  const t = document.createElement("div"); t.className = "toc-t"; t.textContent = "Оглавление"; toc.appendChild(t);
  const items = [];
  let curSub = null, curParent = null;
  heads.forEach(h => {
    const proto = h.closest(".proto");
    const target = proto || h;
    if (!target.id) target.id = "sec-" + (n++);
    target.style.scrollMarginTop = "70px";
    const a = document.createElement("a");
    a.href = "#" + target.id;
    a.textContent = proto ? "Прототип: " + h.textContent : h.textContent;
    const isChild = (h.tagName === "H3" && !proto);
    if (isChild) {
      a.className = "h3";
      if (!curSub) {
        curSub = document.createElement("div"); curSub.className = "toc-sub";
        toc.appendChild(curSub);
        if (curParent) curParent.sub = curSub;
      }
      curSub.appendChild(a);
      items.push({target, a, parent: curParent});
    } else {
      curSub = null;
      const row = document.createElement("div"); row.className = "toc-row";
      row.appendChild(a); toc.appendChild(row);
      const it = {target, a, row, sub: null, tgl: null};
      curParent = it; items.push(it);
    }
  });
  items.forEach(it => {
    if (it.sub) {
      const b = document.createElement("button"); b.className = "toc-tgl"; b.textContent = "\u25B6";
      b.addEventListener("click", () => {
        const open = it.sub.classList.toggle("open");
        b.classList.toggle("open", open);
      });
      it.row.appendChild(b); it.tgl = b;
    }
  });
  function setOpen(it, open){
    if (it && it.sub){ it.sub.classList.toggle("open", open); it.tgl.classList.toggle("open", open); }
  }
  let lastOwner = null;
  function onScroll(){
    let cur = items[0];
    for (const it of items) {
      if (it.target.getBoundingClientRect().top <= 90) cur = it; else break;
    }
    items.forEach(it => it.a.classList.toggle("active", it === cur));
    const owner = cur ? (cur.parent || cur) : null;
    if (owner !== lastOwner) { setOpen(owner, true); lastOwner = owner; }
  }
  addEventListener("scroll", onScroll, {passive:true}); onScroll();
})();

</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
(function(){
  function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}

  // Scenario details come from the page's own summary table — zero duplication.
  const data = {};
  document.querySelectorAll("#out table").forEach(t => {
    const first = t.querySelector("tr th, tr td");
    if (!first || first.textContent.trim() !== "ID") return;
    t.querySelectorAll("tr").forEach((tr, i) => {
      if (i === 0) return;
      const c = tr.cells;
      if (!c || c.length < 7) return;
      const id = c[0].textContent.replace(/🆕/g, "").trim();
      data[id] = {ev: c[1].innerHTML, when: c[2].textContent.trim(), ch: c[3].innerHTML,
                  what: c[4].textContent.trim(), skip: c[5].textContent.trim(), rep: c[6].textContent.trim()};
    });
  });

  const panel = document.getElementById("vzpanel");
  function show(id){
    const d = data[id];
    if (!d || !panel) return;
    panel.innerHTML = "<b>" + esc(id) + " · " + esc(d.what) + "</b>" +
      '<div class="vzgrid">' +
      "<span>Событие / триггер</span><span>" + d.ev + "</span>" +
      "<span>Когда</span><span>" + esc(d.when) + "</span>" +
      "<span>Канал</span><span>" + d.ch + "</span>" +
      "<span>Не отправлять, если</span><span>" + esc(d.skip) + "</span>" +
      "<span>Повтор</span><span>" + esc(d.rep) + "</span>" +
      '</div><span class="vzgo">Открыть карточку с текстами ↓</span>';
    panel.querySelector(".vzgo").addEventListener("click", () => {
      const h = Array.from(document.querySelectorAll("#out h3"))
        .find(h => h.textContent.trim().startsWith(id));
      if (h) h.scrollIntoView({behavior: "smooth"});
    });
    panel.scrollIntoView({behavior: "smooth", block: "nearest"});
  }

  mermaid.initialize({startOnLoad: false, securityLevel: "loose", theme: "neutral",
    flowchart: {curve: "basis", htmlLabels: true, useMaxWidth: false}});
  mermaid.run({nodes: document.querySelectorAll("pre.mermaid")}).then(() => {
    document.querySelectorAll(".mermaid g.node").forEach(n => {
      const m = n.textContent.match(/У\d+-\d+/);
      if (!m || !data[m[0]]) return;
      n.classList.add("vz-click");
      n.addEventListener("click", () => show(m[0]));
    });

    // Zoom: fit-to-width by default, buttons for 100% / +/-.
    document.querySelectorAll(".vzwrap").forEach(wrap => {
      const pre = wrap.querySelector("pre.mermaid");
      const svg = pre && pre.querySelector("svg");
      if (!svg) return;
      const w0 = svg.getBoundingClientRect().width, h0 = svg.getBoundingClientRect().height;
      let k = 1;
      const tools = document.createElement("div");
      tools.className = "vztools";
      tools.innerHTML = '<button data-z="fit">Вписать</button>' +
        '<button data-z="1">100%</button><button data-z="-">−</button>' +
        '<button data-z="+">+</button><span class="vzk"></span>';
      wrap.insertBefore(tools, pre);
      const lbl = tools.querySelector(".vzk");
      function setScale(nk, mode){
        k = Math.min(2, Math.max(0.3, nk));
        svg.style.width = (w0 * k) + "px";
        svg.style.height = (h0 * k) + "px";
        lbl.textContent = Math.round(k * 100) + "%";
        tools.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.z === mode));
        if (mode === "1") pre.scrollLeft = (pre.scrollWidth - pre.clientWidth) / 2;
      }
      tools.addEventListener("click", e => {
        const z = e.target.dataset && e.target.dataset.z;
        if (!z) return;
        if (z === "fit") setScale((wrap.clientWidth - 28) / w0, "fit");
        else if (z === "1") setScale(1, "1");
        else setScale(k + (z === "+" ? 0.15 : -0.15), "");
      });
      setScale((wrap.clientWidth - 28) / w0, "fit");
    });
  });
})();
</script>
