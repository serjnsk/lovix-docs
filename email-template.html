# Шаблон email-рассылок Lovix

Единый брендированный паттерн для писем из [контент-плана рассылок](trigger-marketing.html) (сегменты: активация, возврат churn, партнёры, сезонные). Ниже — живое превью письма-примера, дизайн-токены, библиотека блоков и правила вёрстки. Этот документ — источник правды по паттерну: правки дизайна вносятся сюда и в мастер-вёрстку письма-примера.

## Как пользоваться

**Редактору (новое письмо).** Скопировать `emails/2026-09-09-start-guide.html` под именем `emails/ГГГГ-ММ-ДД-слаг.html`, заменить тексты по блокам — каждый блок в коде помечен комментарием `<!-- BLOCK: … -->`, лимиты знаков в [библиотеке блоков](#блоки). Обновить служебный комментарий в шапке файла (тема, прехедер, сегмент, дата, UTM) и `utm_campaign` во всех ссылках. Ненужные блоки удаляются целиком, порядок блоков сохраняется.

**Правки общего паттерна.** Токены, лимиты и правила меняются в этом документе (`email-template.md` → пересборка `email-template.html`); эталонная вёрстка блоков — в письме-примере. Изменил паттерн — обнови и то и другое, письма наследуют паттерн копированием.

## Библиотека блоков

Порядок фиксированный. В коде письма каждый блок помечен `<!-- BLOCK: … -->`.

| # | Блок | Назначение и правила | Лимиты | Обязателен |
|---|---|---|---|---|
| 0 | Прехедер | скрытый div сразу после `<body>`; дополняет тему, не дублирует её | ≤ 90 симв. | да |
| 1 | header | лого-ссылка на главную | — | да |
| 2 | hero | kicker + H1 + лид + чат-пузырь (реплика компаньона, имя, статус «в сети») + портрет справа; на мобильном текст над фото | H1 ≤ 40 · лид ≤ 140 · реплика ≤ 80 | да (пузырь опционален) |
| 3 | интро | 1 абзац с обращением `{{first_name\|…}}`, подводка к содержимому | ≤ 260 симв. | нет |
| 4 | гид-шаги | 2–4 нумерованных шага с разделителями; ссылки внутри текста шага | заголовок ≤ 32 · текст ≤ 150 | нет |
| 5 | компаньоны 2-up | 2 карточки: фото, имя, чип стиля («реалистичная»/«аниме»), реплика-цитата, кнопка-ссылка на прямой чат `/bot/<слаг>/chat`; на мобильном в столбик | цитата ≤ 90 · кнопка ≤ 20 | нет |
| 6 | CTA | главная кнопка (градиент + VML-фоллбек) + строка-успокоение под ней («Бесплатно. Без карты…») | кнопка ≤ 24 | да |
| 7 | промо-плашка | эмодзи + 1–2 предложения + текстовая ссылка; мягкий апселл, не второй CTA | ≤ 160 симв. | нет |
| 8 | футер | причина получения + `{{email}}`, отписка `{{unsubscribe_url}}`, правовая информация, контакты, чип 18+, дисклеймер об AI-персонажах, © и `{{company_address}}` | структура не меняется | да |

Подбор персонажей для блоков 2 и 5: только персонажи из каталога с «взрослой» внешностью, изображения — постельно-безопасные (одетые, без явного NSFW): письмо проходит фильтры почтовых провайдеров. Реплики — флирт лёгкого тона, без эксплицита.

## Тех. правила вёрстки

- Только **табличная вёрстка** (`role="presentation"`) и **инлайн-стили**. `<style>` в `<head>` — исключительно media-query для мобильной адаптации и reset-правила.
- Запрещено в критичном контенте: flex/grid, JS, SVG, `background-image` с текстом поверх, webfont без fallback.
- Тёмная тема захардкожена: `bgcolor` продублирован атрибутом на каждом уровне (body, таблицы, ячейки) — письмо не «белеет» в клиентах без поддержки CSS.
- Картинки: явные `width`/`height`, содержательный `alt`, `display:block`, ретина ×2 через CDN-ресайз `https://cdn.test.lovix.ai/ioss(quality=85,resize=N)/prod/…`, фон-заглушка `#221A2A` на случай блокировки картинок.
- Кнопки — bulletproof: таблица/ссылка + `<v:roundrect>` в условном комментарии `<!--[if mso]>` для Outlook; градиент всегда с solid-fallback `background-color:#D946EF`.
- Лого — PNG с прозрачностью (`emails/img/logo.png`). Прод-вариант на CDN (`full-text-logo.png`) имеет непрозрачную подложку — в письмах не использовать; перед боевой отправкой перелить прозрачный PNG на прод-CDN и заменить URL.
- Вес HTML ≤ 100 КБ (лимит обрезки Gmail), сейчас ~18 КБ.
- Все ссылки абсолютные `https`, на каждой UTM: `utm_source=email&utm_medium=crm&utm_campaign=<ГГГГ-ММ-ДД-слаг>&utm_content=<блок>`.
- Плейсхолдеры ESP: `{{first_name|фоллбек}}`, `{{email}}`, `{{unsubscribe_url}}`, `{{company_address}}` — синтаксис финализируется под выбранный сервис рассылки.

## Контент-правила

- **Тема** ≤ 50 симв., без кликбейта и CAPS; эмодзи — максимум 1 и не в начале. **Прехедер** ≤ 90 симв., продолжает тему.
- **Тон**: тёплый, на «ты», лёгкий флирт без эксплицита (иначе — спам-фильтры и блок ESP). Партнёрские письма — деловой тон, без пин-ап образов, на «вы».
- **CTA по сегментам**: активация — «Начать чат»; churn — «Вернуться в Lovix»; партнёры — «Открыть кабинет»; сезонные — тематический.
- **Локализация**: мастер — RU; EN/DE — отдельными файлами `…-en.html` / `…-de.html` (колонки контент-плана), вёрстка общая.
- **Обязательно в каждом письме**: чип 18+, ссылка отписки, причина получения, дисклеймер об AI-персонажах.

## Чек-лист перед отправкой

1. Тема ≤ 50 и прехедер ≤ 90 симв., прехедер не обрезает смысл.
2. Все ссылки кликабельны, ведут на прод и содержат корректный `utm_campaign`.
3. Плейсхолдеры ESP подставлены/протестированы, отписка работает.
4. Рендер-тест: Gmail (web + Android), Apple Mail (светлая и тёмная тема), Outlook (VML-кнопки на месте).
5. Картинки: грузятся по https, alt-тексты читаются при блокировке, вес письма ≤ 100 КБ.
6. Тестовая отправка на внутренние ящики, проверка папки «Спам».

<script>
  const raw = document.getElementById("src").textContent;
  document.getElementById("out").innerHTML = marked.parse(raw, {gfm:true});


  (function(){
  const main = document.querySelector("main");
  const toc = document.getElementById("toc");
  const heads = main.querySelectorAll(".md h2, .md h3, .proto-label b");
  let n = 0;
  const t = document.createElement("div"); t.className = "toc-t"; t.textContent = "На этой странице"; toc.appendChild(t);
  const items = [];
  let curSub = null, curParent = null;
  heads.forEach(h => {
    const proto = h.closest(".proto");
    const target = proto || h;
    if (!target.id) target.id = "sec-" + (n++);
    target.style.scrollMarginTop = "70px";
    const a = document.createElement("a");
    a.href = "#" + target.id;
    a.textContent = proto ? "Прототип: " + h.textContent : h.textContent;
    const isChild = (h.tagName === "H3" && !proto);
    if (isChild) {
      a.className = "h3";
      if (!curSub) {
        curSub = document.createElement("div"); curSub.className = "toc-sub";
        toc.appendChild(curSub);
        if (curParent) curParent.sub = curSub;
      }
      curSub.appendChild(a);
      items.push({target, a, parent: curParent});
    } else {
      curSub = null;
      const row = document.createElement("div"); row.className = "toc-row";
      row.appendChild(a); toc.appendChild(row);
      const it = {target, a, row, sub: null, tgl: null};
      curParent = it; items.push(it);
    }
  });
  items.forEach(it => {
    if (it.sub) {
      const b = document.createElement("button"); b.className = "toc-tgl"; b.textContent = "\u25B6";
      b.addEventListener("click", () => {
        const open = it.sub.classList.toggle("open");
        b.classList.toggle("open", open);
      });
      it.row.appendChild(b); it.tgl = b;
    }
  });
  function setOpen(it, open){
    if (it && it.sub){ it.sub.classList.toggle("open", open); it.tgl.classList.toggle("open", open); }
  }
  let lastOwner = null;
  function onScroll(){
    let cur = items[0];
    for (const it of items) {
      if (it.target.getBoundingClientRect().top <= 90) cur = it; else break;
    }
    items.forEach(it => it.a.classList.toggle("active", it === cur));
    const owner = cur ? (cur.parent || cur) : null;
    if (owner !== lastOwner) { setOpen(owner, true); lastOwner = owner; }
  }
  addEventListener("scroll", onScroll, {passive:true}); onScroll();
})();

  pv.classList.toggle('mob', mob);
