# Админка — модуль «Управление контентом»

Цель: контент-менеджеры управляют каталогом сами — боты, категории, фото, промпты генерации — без разработчиков и без обходных путей через «Создать из фото». SEO выносится в отдельный раздел со своими правами: страницы и мета — у SEO, наполнение — у контента. Сейчас привязка бот↔категория только динамическая через характеристики, фильтры делает SEO, а КМ вынужден подгонять характеристики под фильтры вслепую — модуль убирает этот разрыв.

## Схема модуля

Событие → правило → выдача. Ключевое изменение — **pin/exclude поверх автофильтра**: автофильтр остаётся базой (боты пользователей попадают в категории сами), ручное прикрепление и исключение работают поверх и переживают изменение фильтров.

## Проблемы, которые закрываем

| № | Боль из треда | Решение в модуле |
|---|---|---|
| Б1 | Нельзя руками добавить бота в категорию — только подгоном характеристик | Pin/exclude поверх автофильтра (Р2), массовый выбор галочками из базы |
| Б2 | Характеристики ставит ИИ и они «надуманные»: однотипные лица, неверные категории | Ручная правка характеристик — источник правды, ИИ не перетирает (Р1) |
| Б3 | Непонятно, какие характеристики тянутся в какую категорию и кто задал фильтр | Вкладка фильтра с расшифровкой + отчёт по всем категориям (Р2, Р5) |
| Б4 | Один и тот же генератор (Grok) даёт однообразный контент | Кастомный промпт изображений и выбор модели per категория (Р2) |
| Б5 | Одна фотка на все категории — приходится генерить дубли ботов и превью-видео | Метки фото per категория: категория показывает подходящее фото (Р3) |
| Б6 | SEO и контент смешаны: фильтры делает SEO, наполняет КМ, ответственность размыта | Отдельный SEO-раздел, статусы категории, права по ролям (Р4) |
| Б7 | Малочисленные категории ищутся вручную | Отчёт наполненности с подсветкой и порогом (Р5) |

## Р1. Каталог ботов

Единый список всех шаблонных ботов с поиском и фильтрами по характеристикам.

| № | Требование |
|---|---|
| К1 | Карточка бота: все характеристики редактируются вручную. Ручное значение помечается и **не перетирается** переобработкой ИИ; бейдж у каждого поля — «ИИ» или «вручную» |
| К2 | Блок «Категории»: в каких показывается сейчас и почему — источник «фильтр» или «pin»; для непопавших — диагностика, какие условия фильтра не прошёл |
| К3 | Прикрепить/исключить категории прямо из карточки (чекбоксы по списку категорий) |
| К4 | Массовые операции по выборке: проставить характеристику, прикрепить к категории, отправить на перегенерацию описания |
| К5 | Переработка ИИ запускается вручную по кнопке (бот/выборка), а не молча по всему каталогу |

## Р2. Категории — контентная часть

| № | Требование |
|---|---|
| КТ1 | Вкладка «Фильтр»: условия читаются как список «характеристика — значение», редактируются; изменение фильтра показывает предпросмотр «кто войдёт / кто выпадет» до сохранения |
| КТ2 | Вкладка «Боты»: текущая выдача с источником (фильтр/pin), кнопка «Добавить из базы» — таблица всех ботов с галочками и поиском (сценарий Насти: наполнить категорию за один проход) |
| КТ3 | Pin переживает изменение фильтра; exclude сильнее фильтра; и то и другое видно списками «Прикреплённые» и «Исключённые» |
| КТ4 | Помощник «поместить через характеристики»: для выбранных ботов проставляет минимальный набор характеристик под фильтр категории (план Александра, для случаев когда pin нежелателен); при коллизии условий (молодая + милфа) — предупреждение, не молчаливый выбор |
| КТ5 | Промпт генерации per категория: кастомный промпт изображений с переменными ({категория}, {пол}, {возраст}…), выбор модели генерации (Grok / Nano Banana / …), тестовая генерация 1 шт. до запуска пачки |
| КТ6 | Промпты имён и описаний: редактируются на уровне категории с фолбэком на глобальный |
| КТ7 | Счётчик наполненности на списке категорий; порог малочисленности настраивается, малочисленные подсвечены |

## Р3. Медиатека

| № | Требование |
|---|---|
| М1 | У бота несколько фото; на фото — метки категорий (одна фото-метка на несколько категорий допустима) |
| М2 | В выдаче категории бот показывается с фото, помеченным этой категорией; нет метки — основное фото |
| М3 | Фото добавляются вручную (загрузка) и генерацией по промпту категории; превью-видео не перегенерируется, если у бота уже есть — экономия генераций |
| М4 | Основное фото назначается явно |

## Р4. SEO — отдельный раздел

| № | Требование |
|---|---|
| С1 | SEO-страница категории: slug, title, description, H1, тексты, hreflang/canonical — редактирует только роль SEO |
| С2 | Создание категории — из SEO-раздела: страница + черновик фильтра (как сейчас делает Костя); дальше категория переходит контенту |
| С3 | Статусы категории: «черновик SEO» → «наполнение» → «опубликована»; неопубликованные не видны на сайте |
| С4 | Права: SEO не редактирует ботов и привязки; КМ не редактирует мету и slug; админ — всё |

## Р5. Отчёты и аудит

| № | Требование |
|---|---|
| О1 | Отчёт «Категории»: фильтр в читаемом виде, сколько ботов всего / по фильтру / по pin, дата последнего изменения — закрывает вопрос «какие характеристики куда тянутся» одним экраном |
| О2 | Отчёт «Малочисленные»: категории ниже порога, сортировка по трафику страницы (приоритет наполнения) |
| О3 | Аудит-лог: кто и когда менял фильтр, характеристики, привязки, промпты — с прежним значением |

## Сценарии работы

| Сценарий | Шаги |
|---|---|
| Наполнить малочисленную категорию | Р5-отчёт → категория → «Добавить из базы» → отфильтровал, отметил галочками → pin. Один проход, без генерации дублей и новых превью-видео |
| Новая SEO-категория | SEO создаёт страницу и черновик фильтра → статус «наполнение» → КМ правит фильтр по предпросмотру, пинит недостающих, при необходимости генерит пачку по промпту категории → «опубликована» |
| Пак новых ботов под категорию | КТ5: тест-генерация 1 шт. → правка промпта → пачка → авто-характеристики ИИ → выборочная ручная проверка (К1) → боты в категории по фильтру |

## Декомпозиция на задачи

Размер: S — до пары дней, M — до недели, L — больше. Часы проставляет Александр при нарезке.

| Этап | Задача | Размер |
|---|---|---|
| 1 · быстрые победы | Э1-1 Pin/exclude поверх автофильтра: модель, карточка бота (К3), списки в категории (КТ3) | M |
| 1 | Э1-2 «Добавить из базы» галочками с поиском (КТ2) | M |
| 1 | Э1-3 Отчёт по категориям и малочисленным (О1, О2) | S |
| 1 | Э1-4 Ручная правка характеристик с защитой от перетирания ИИ (К1, К5) | S |
| 2 · качество генерации | Э2-1 Кастомный промпт изображений + выбор модели + тест-генерация (КТ5) | M |
| 2 | Э2-2 Промпты имён и описаний per категория (КТ6) | S |
| 2 | Э2-3 Помощник «поместить через характеристики» с предупреждением о коллизиях (КТ4) | M |
| 2 | Э2-4 Предпросмотр изменения фильтра (КТ1) | S |
| 3 · медиа и развод ролей | Э3-1 Метки фото per категория + выбор фото в выдаче (М1–М4) | M |
| 3 | Э3-2 SEO-раздел: страницы, статусы, права (С1–С4) | L |
| 3 | Э3-3 Аудит-лог (О3) | S |
| 3 | Э3-4 Массовые операции по выборке ботов (К4) | M |

Этап 1 закрывает текущую задачу Насти «+20 персонажей в неделю в малочисленные категории» без обходных путей; этап 2 убирает причину однообразия контента; этап 3 разводит роли и наводит порядок надолго.

## Принятые решения

- Автофильтр **остаётся базой** привязки — боты пользователей попадают в категории без ручного протыкивания (позиция Александра). Pin/exclude — поверх, не вместо.
- Ручные значения характеристик сильнее ИИ и не перетираются.
- Промпты генерации управляются на уровне категории с фолбэком на глобальные.
- SEO и контент — разные разделы и разные права; категория проходит статусы от черновика SEO до публикации.

## Открытые вопросы

- Формат переменных в промптах категории (список подстановок) — согласовать при Э2-1.
- Порог «малочисленности» по умолчанию — предложение: 12 ботов.
- Нужна ли модерация pin'ов (просмотр админом) или доверяем КМ полностью.

<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
(function(){
  function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}

  // Scenario details come from the page's own summary table — zero duplication.
  const data = {};
  document.querySelectorAll("#out table").forEach(t => {
    const first = t.querySelector("tr th, tr td");
    if (!first || first.textContent.trim() !== "ID") return;
    t.querySelectorAll("tr").forEach((tr, i) => {
      if (i === 0) return;
      const c = tr.cells;
      if (!c || c.length < 7) return;
      const id = c[0].textContent.replace(/🆕/g, "").trim();
      data[id] = {ev: c[1].innerHTML, when: c[2].textContent.trim(), ch: c[3].innerHTML,
                  what: c[4].textContent.trim(), skip: c[5].textContent.trim(), rep: c[6].textContent.trim()};
    });
  });

  const panel = document.getElementById("vzpanel");
  function show(id){
    const d = data[id];
    if (!d || !panel) return;
    panel.innerHTML = "<b>" + esc(id) + " · " + esc(d.what) + "</b>" +
      '<div class="vzgrid">' +
      "<span>Событие / триггер</span><span>" + d.ev + "</span>" +
      "<span>Когда</span><span>" + esc(d.when) + "</span>" +
      "<span>Канал</span><span>" + d.ch + "</span>" +
      "<span>Не отправлять, если</span><span>" + esc(d.skip) + "</span>" +
      "<span>Повтор</span><span>" + esc(d.rep) + "</span>" +
      '</div><span class="vzgo">Показать тексты ↓</span>';
    panel.querySelector(".vzgo").addEventListener("click", () => {
      // Content tables have 5 columns (ID|Канал|Сообщение|CTA|Мерим); summary has 7.
      const tables = Array.from(document.querySelectorAll("#out table")).filter(t => {
        const h = t.querySelectorAll("thead th");
        return h.length === 5 && h[0].textContent.trim() === "ID";
      });
      for (const t of tables) {
        const row = Array.from(t.querySelectorAll("tr")).find(tr =>
          tr.cells && tr.cells[0] && tr.cells[0].tagName === "TD" &&
          tr.cells[0].textContent.replace(/🆕/g, "").trim().startsWith(id));
        if (row) {
          row.scrollIntoView({behavior: "smooth", block: "center"});
          row.classList.remove("vzflash");
          void row.offsetWidth;
          row.classList.add("vzflash");
          return;
        }
      }
      // No table row (e.g. У7-1 — generated text): jump to the group heading.
      const grp = id.split("-")[0] + ".";
      const h2 = Array.from(document.querySelectorAll("#out h2"))
        .find(h => h.textContent.trim().startsWith(grp));
      if (h2) h2.scrollIntoView({behavior: "smooth"});
    });
    panel.scrollIntoView({behavior: "smooth", block: "nearest"});
  }

  mermaid.initialize({startOnLoad: false, securityLevel: "loose", theme: "neutral",
    flowchart: {curve: "basis", htmlLabels: true, useMaxWidth: false}});
  mermaid.run({nodes: document.querySelectorAll("pre.mermaid")}).then(() => {
    document.querySelectorAll(".mermaid g.node").forEach(n => {
      const m = n.textContent.match(/У\d+-\d+/);
      if (!m || !data[m[0]]) return;
      n.classList.add("vz-click");
      n.addEventListener("click", () => show(m[0]));
    });

    // Miro-like canvas: drag to pan, wheel / pinch to zoom, buttons for fit/100%/±.
    document.querySelectorAll(".vzwrap").forEach(wrap => {
      const pre = wrap.querySelector("pre.mermaid");
      const svg = pre && pre.querySelector("svg");
      if (!svg) return;
      let k = 1, tx = 0, ty = 0, mode = "", interacted = false;
      function nat(){
        const t = svg.style.transform;
        svg.style.transform = "none";
        const r = svg.getBoundingClientRect();
        svg.style.transform = t;
        return {w: r.width, h: r.height};
      }
      function box(){
        // Hidden tab / collapsed pane can report a 0-height viewport; fall
        // back to sane defaults so fit() never collapses to the min zoom.
        const W = wrap.clientWidth || 960, H = wrap.clientHeight || 480;
        return {W: Math.max(W, 320), H: Math.max(H, 320)};
      }

      const tools = document.createElement("div");
      tools.className = "vztools";
      tools.innerHTML = '<button data-z="fit">Вписать</button>' +
        '<button data-z="1">100%</button><button data-z="-">−</button>' +
        '<button data-z="+">+</button><span class="vzk"></span>' +
        '<span class="vzhint">двигай мышью · зум колесом</span>';
      wrap.appendChild(tools);
      const lbl = tools.querySelector(".vzk");

      function apply(){
        svg.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + k + ")";
        lbl.textContent = Math.round(k * 100) + "%";
        tools.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.z === mode));
      }
      function clamp(v){ return Math.min(3, Math.max(0.1, v)); }
      function zoomAt(cx, cy, f, m){
        const nk = clamp(k * f);
        tx = cx - (cx - tx) * (nk / k);
        ty = cy - (cy - ty) * (nk / k);
        k = nk; mode = m || ""; apply();
      }
      function fit(){
        const b = box(), n = nat();
        k = clamp(Math.min((b.W - 24) / n.w, (b.H - 24) / n.h));
        tx = (b.W - n.w * k) / 2; ty = (b.H - n.h * k) / 2;
        mode = "fit"; apply();
      }
      function hundred(){
        const b = box(), n = nat();
        k = 1; tx = (b.W - n.w) / 2; ty = (b.H - n.h) / 2;
        mode = "1"; apply();
      }
      tools.addEventListener("click", e => {
        const z = e.target.dataset && e.target.dataset.z;
        if (!z) return;
        e.stopPropagation();
        interacted = true;
        if (z === "fit") fit();
        else if (z === "1") hundred();
        else zoomAt(wrap.clientWidth / 2, wrap.clientHeight / 2, z === "+" ? 1.25 : 0.8);
      });

      wrap.addEventListener("wheel", e => {
        e.preventDefault();
        interacted = true;
        const r = wrap.getBoundingClientRect();
        zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015));
      }, {passive: false});

      wrap.addEventListener("dblclick", e => {
        if (e.target.closest("g.node") || e.target.closest(".vztools")) return;
        const r = wrap.getBoundingClientRect();
        zoomAt(e.clientX - r.left, e.clientY - r.top, 1.5);
      });

      // Pointers: 1 finger/button = pan, 2 fingers = pinch. Click passes through
      // only when the pointer barely moved.
      const pts = new Map();
      let moved = false, suppressClick = false, pin = null, start = null;
      wrap.addEventListener("pointerdown", e => {
        if (e.target.closest(".vztools")) return;
        // No pointer capture yet: capturing here would retarget the follow-up
        // click to the canvas and node clicks would never fire. Capture only
        // once an actual drag starts (threshold crossed) or a pinch begins.
        interacted = true;
        pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
        if (pts.size === 1) { moved = false; suppressClick = false; start = {x: e.clientX, y: e.clientY}; }
        if (pts.size === 2) { try { wrap.setPointerCapture(e.pointerId); } catch(_){} }
        pin = null;
      });
      wrap.addEventListener("pointermove", e => {
        if (!pts.has(e.pointerId)) return;
        const prev = pts.get(e.pointerId);
        pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
        const r = wrap.getBoundingClientRect();
        if (pts.size === 1) {
          if (!moved && start && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 5) return;
          if (!moved) { try { wrap.setPointerCapture(e.pointerId); } catch(_){} }
          moved = true;
          wrap.classList.add("dragging");
          tx += e.clientX - prev.x; ty += e.clientY - prev.y; mode = ""; apply();
        } else if (pts.size === 2) {
          const [a, b] = Array.from(pts.values());
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          const mid = {x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top};
          if (pin) {
            zoomAt(mid.x, mid.y, dist / pin.dist);
            tx += mid.x - pin.mid.x; ty += mid.y - pin.mid.y; apply();
          }
          pin = {dist: dist, mid: mid};
          moved = true;
        }
      });
      function release(e){
        if (!pts.has(e.pointerId)) return;
        pts.delete(e.pointerId);
        pin = null;
        if (pts.size === 0) {
          wrap.classList.remove("dragging");
          if (moved) suppressClick = true;
        }
      }
      wrap.addEventListener("pointerup", release);
      wrap.addEventListener("pointercancel", release);
      wrap.addEventListener("click", e => {
        if (suppressClick) { suppressClick = false; e.stopPropagation(); e.preventDefault(); }
      }, true);

      // Initial fit; re-fit when the canvas gets its real size (hidden tab,
      // pane resize, late font layout) until the user pans/zooms themselves.
      fit();
      [120, 400, 900].forEach(ms => setTimeout(() => { if (!interacted) fit(); }, ms));
      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(() => { if (!interacted) fit(); }).observe(wrap);
      }
    });
  });
})();
</script>
