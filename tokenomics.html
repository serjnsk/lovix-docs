# Токеномика

---

## 1. Тарифы

| | Free | Premium — 990 ₽/мес | VIP — 1590 ₽/мес |
|---|---|---|---|
| Токенов в месяц | стартовый бонус (раздел 5) | **300** | **550** |
| Цена одного токена | — | 3,30 ₽ | 2,89 ₽ — на 12% ниже |
| Сообщения | 5/мес | **500/день** | безлимит¹ |
| Нейромодель | базовая | базовая | **Lovix 2.0** |
| Создание компаньонов | нет | да | да |
| Генерация фото | в пределах бонуса² | да | да |
| Аудио сообщения | нет | да | да |
| Генерация видео | нет | нет | да |
| Аудио звонки | нет | нет | да |
| Групповые чаты³ | нет | нет | да |
| Покупка пакетов токенов | нет | да | да |
| Цена 3 мес (−10%) | — | 2 670 ₽ · 890/мес | 4 290 ₽ · 1430/мес |
| Цена 1 год (−20%) | — | 9 490 ₽ · 790/мес | 15 260 ₽ · 1272/мес |

¹ Технический мягкий предел `DAILY_MESSAGE_SOFT_LIMIT` = 1200/сутки, пользователю не показывается.
² Только если стартовый бонус выдан по активной политике (раздел 5); без бонуса генерация на Free недоступна.
³ В интерфейсе тарифов сопровождается пояснением-тултипом.

**Объём токенов VIP — от формулы, округлён до маркетингового значения:**

```
база     = округление вверх( VIP_PRICE ÷ (PREMIUM_TOKEN_PRICE × 0,9) )
         = округление вверх( 1590 ÷ (3,30 × 0,9) ) = 536
VIP_GRANT = 550  — округление базы до маркетингового значения
```

Формула задаёт минимум (скидка на токен не менее 10%), итог округляется вверх до круглого числа. Фактическая скидка при 550 — 12%. При изменении цены любого тарифа база пересчитывается и объём заново округляется.

**Цена токена** = цена тарифа ÷ объём токенов за период. Расчётная величина, основа лестницы.

**Проверка Т4 на текущих ценах:** маржинальная цена токена при переходе Premium → VIP = (1590 − 990) ÷ (550 − 300) = **2,40 ₽**. Пакеты по правилу Т1 дороже 3,30 ₽ за токен, значит апгрейд всегда выгоднее докупки — лестница сходится.

### Скидки за период

| Период | Скидка | Обоснование |
|---|---|---|
| 3 месяца | **−10%** | Достаточно, чтобы сместить часть месячных на квартал; глубже — чистая каннибализация месячной цены |
| 1 год | **−20%** | Верх стандартного диапазона 15–25%. Годовая предоплата в нише с высоким оттоком стоит этой скидки. Глубже 25% — притягивает возвраты и chargeback на забытых продлениях и занижает якорь ценности месячного тарифа |

| № | Правило |
|---|---|
| Т10 | Скидка за период применяется **к цене**. Месячный транш токенов одинаков во всех периодах: Premium — 300/мес, VIP — 550/мес (правило Т6 — выгода не удваивается) |
| Т11 | Скидки — параметры `PERIOD_DISCOUNT_3M`, `PERIOD_DISCOUNT_1Y`. Итоговые цены после изменения скидки округляются до маркетинговых значений вручную |

Цена токена по периодам (расчётная): Premium — 3,30 / 2,97 / 2,64 ₽; VIP — 2,89 / 2,60 / 2,31 ₽. Правило Т2 (VIP дешевле Premium) выполняется внутри каждого периода. Правило Т1 задаёт нижнюю границу цены пакетов: **дороже 3,30 ₽ за токен**.

### Правила лестницы

Проверяются при каждом изменении любой цены.

| № | Правило | При нарушении |
|---|---|---|
| Т1 | Цена токена в тарифе ниже цены токена в любом пакете | Подписка теряет смысл как источник токенов, пользователи уходят в разовые покупки |
| Т2 | Цена токена в VIP ниже, чем в Premium | Отличие старшего тарифа отсутствует |
| Т3 | Объём токенов VIP больше объёма Premium | Отличие старшего тарифа отсутствует |
| Т4 | **Маржинальная цена токена при переходе Premium → VIP ниже цены токена в самом выгодном пакете.** Считается: (цена VIP − цена Premium) ÷ (объём VIP − объём Premium) | **VIP не покупают** — выгоднее остаться на Premium и докупать пакеты. Несущее правило лестницы |
| Т5 | Цена токена в пакете для VIP не выше, чем для Premium | Пакет работает доводом против старшего тарифа |
| Т6 | Длинный период даёт либо больший транш, либо скидку на цену — не оба в полном размере | Годовой тариф снижает маржу дважды |
| Т7 | Объём тарифа покрывает типичное потребление, но не потолок — целевая доля `TARGET_COVERAGE_PCT` | При избыточном объёме пакеты не продаются, при недостаточном тариф воспринимается неполноценным |

### Доступность операций по тарифам

| № | Правило |
|---|---|
| Т8 | Состав доступных операций и функций читается **из настроек тарифа** (таблица тарифов выше), не из проверок вида «если тариф VIP» |
| Т9 | Операция может быть недоступна на тарифе независимо от баланса. **Недоступность по тарифу и нехватка токенов — разные сообщения.** Иначе пользователь купит пакет и обнаружит, что операция всё равно недоступна. Для VIP-операций (видео, звонки) это сообщение — точка апсейла Premium → VIP |

## 2. Пакеты токенов

| № | Правило |
|---|---|
| П1 | **Три номинала.** Средний целевой, крайние работают ориентирами |
| П2 | Цена токена падает с размером пакета |
| П3 | Цена токена в самом мелком пакете выше, чем в любом тарифе. Мелкий пакет — для случая «нужно прямо сейчас», он не конкурирует с подпиской |
| П4 | **Пакеты не сгорают** и не имеют срока действия |
| П5 | **Недоступны на бесплатном тарифе.** При нехватке токенов бесплатному пользователю предлагается подписка |
| П6 | Покупка пакета не продлевает и не изменяет подписку, не влияет на дату продления |
| П7 | Пакет нельзя купить в дни 1–4 неоплаченного продления (раздел 8): сначала восстанавливается подписка |

### Момент продажи

Точка продажи пакета — отказ операции из-за нехватки токенов: у пользователя одновременно есть намерение и препятствие.

| № | Правило |
|---|---|
| П8 | **Пакет предлагается первым вариантом, переход на старший тариф — вторым.** Пользователь пришёл выполнить действие, а не менять тариф |
| П9 | Предложение показывается на месте отказа, без перехода на другую страницу |
| П10 | Указывается, сколько токенов не хватает до запрошенной операции |

---

## 3. Прайс-лист операций

| № | Правило |
|---|---|
| Ц1 | Все тарифицируемые операции ведутся **единым прайс-листом**. Стоимость каждой хранится в настройках, не в коде |
| Ц2 | **Добавление операции — настроечное действие**, не доработка |
| Ц3 | У операции задаются: наименование для пользователя, стоимость в токенах, доступность по тарифам |
| Ц4 | Стоимость — целое число токенов. Дробных токенов нет |
| Ц5 | Стоимость может различаться по тарифам; по умолчанию едина |
| Ц6 | Изменение стоимости задаётся с датой вступления в силу, задним числом не применяется |
| Ц7 | Номинал: стоимость самой частой операции — **десятки токенов**. Это даёт запас на операции дешевле и дороже без пересчёта балансов |

| Операция | Стоимость в токенах | Себестоимость | Единица |
|---|---|---|---|
| Генерация фото | `PHOTO_COST` | `PHOTO_COGS` | за фото |
| Аудио сообщение | `AUDIO_MSG_COST` | `AUDIO_MSG_COGS` | за сообщение |
| Генерация видео | `VIDEO_COST` | `VIDEO_COGS` | за видео |
| Аудио звонок | `CALL_COST` | `CALL_COGS` | `[?]` — за звонок или за минуту |
| Текстовое сообщение | 0 | `MESSAGE_COGS` | за обмен сообщениями |

У каждой операции две переменные:

- **Стоимость в токенах** (`*_COST`) — видна пользователю, задаёт, на сколько действий хватает транша.
- **Себестоимость** (`*_COGS`) — **пользователю не показывается никогда.** Используется только в расчёте маржи тарифа и маржи каждой операции (раздел 13).

Обе — рабочие переменные управления маржой: корректируются без изменения цен тарифов и объёмов токенов. Групповые чаты и нейромодель Lovix 2.0 токенов не расходуют — это функции тарифа, а не операции прайс-листа.

### Сообщения

| № | Правило |
|---|---|
| Ц8 | Обмен текстовыми сообщениями токенов не расходует. Ограничения: Free — 5/мес; Premium — 500/день, лимит виден пользователю; VIP — безлимит с техническим мягким пределом 1200/сутки, пользователю не показывается |
| Ц9 | Сообщения и токены не пересекаются: пакет токенов не увеличивает лимит сообщений. При исчерпании квоты Free предлагается подписка, при исчерпании дневного лимита Premium — переход на VIP. Пакет токенов в этих точках не предлагается никогда |

## 4. Источники токенов

| Источник | Откуда | При смене месячного цикла | При падении на Free |
|---|---|---|---|
| **Тарифные** | Ежемесячный транш подписки | **сгорают** | **сгорают** |
| **Купленные** | Пакеты | переносятся, **не сгорают никогда** | **замораживаются** бессрочно |
| **Бонусные** | Стартовый бонус, промо, компенсации | сгорают, если правилом акции не задано иное | сгорают |

| № | Правило |
|---|---|
| И1 | **Порядок расходования: тарифные → бонусные → купленные.** Внутри источника — те, что сгорают раньше. При обратном порядке пользователь тратит несгораемые токены, а сгораемые пропадают неиспользованными |
| И2 | Одна операция может быть оплачена из нескольких источников, если в первом не хватает |
| И3 | Пользователь источник не выбирает. Наружу выходит только строка о замороженных токенах |

---

## 5. Стартовый бонус (Free)

| № | Правило |
|---|---|
| С1 | Бонус задаётся **политикой в настройках**: размер, условие выдачи, срок жизни |
| С2 | Условие выдачи: сразу при регистрации · после привязки телеграма · после подтверждения почты · после любого из двух |
| С3 | Политика назначается по варианту эксперимента. Вариант закрепляется при регистрации и не меняется |
| С4 | Каждое начисление фиксирует, по какой политике оно произошло |
| С5 | Смена политики применяется только к новым регистрациям |
| С6 | Бонус — сгораемый источник: при падении с платного тарифа на Free не переносится и не замораживается |

---

## 6. Начисление тарифных токенов

| № | Правило |
|---|---|
| Н1 | Начисление — **равными ежемесячными траншами**: 1 транш при периоде месяц, 3 при трёх месяцах, 12 при годе. Единовременная выдача всего объёма запрещена |
| Н2 | Остаток транша сгорает в конце месячного цикла. Цикл привязан к траншу, не к оплаченному периоду |
| Н3 | Транш начисляется в дату-годовщину оплаты; если такого числа в месяце нет — в последний день месяца |
| Н4 | Первый транш — немедленно при успешной оплате |
| Н5 | За `EXPIRY_WARNING_DAYS` до сгорания остатка отправляется предупреждение. Оно касается только тарифных токенов; купленные не упоминаются — они не сгорают |
| Н6 | Выгода длинного периода — в размере транша или в цене, не в единовременной выдаче |
| Н7 | Формулировка для пользователя — «N токенов каждый месяц». Помесячная выдача указана в условиях тарифа |

### Смена тарифа

| Событие | Токены |
|---|---|
| Переход на старший тариф | Разница траншей доначисляется немедленно, пропорционально остатку цикла |
| Переход на младший тариф | Со следующего цикла. Текущий транш не пересчитывается и не изымается |
| Продление того же тарифа | Остаток тарифных сгорает, начисляется новый транш. Купленные не затрагиваются |
| Возобновление после закрытия | Первый транш нового периода, купленные размораживаются |

| № | Правило |
|---|---|
| Н8 | **Изъятие уже начисленных токенов запрещено** — пользователь уже видел этот баланс |
| Н9 | Операции, недоступные на новом младшем тарифе, отключаются со следующего цикла, одновременно со сменой объёма |

---

## 7. Расходование

| № | Правило |
|---|---|
| Р1 | Списание — **при постановке операции в работу**, не после завершения. Иначе пользователь запустит больше, чем может оплатить |
| Р2 | Проверка баланса и списание — одно неделимое действие |
| Р3 | При нехватке операция не запускается, списания нет, факт нехватки фиксируется |
| Р4 | Перед списанием проверяется доступность операции на тарифе. Недоступная не запускается даже при достаточном балансе |
| Р5 | Одновременные запросы принимаются по порядку поступления, пока хватает баланса |

### Возвраты токенов

| Случай | Токены |
|---|---|
| Ошибка выполнения, таймаут | возвращаются полностью |
| Блокировка модерацией | возвращаются полностью |
| Отмена до начала обработки | возвращаются полностью |
| Отмена после начала обработки | не возвращаются; условие показывается до запуска |

| № | Правило |
|---|---|
| Р6 | Возврат — **в тот же источник**, из которого списано. Возврат тарифных в купленные создал бы несгораемые токены из ничего |
| Р7 | Возврат автоматический, до уведомления пользователя. Обращение в поддержку не требуется |
| Р8 | Если исходный транш уже сгорел, возврат идёт в бонусный источник со сроком до конца текущего цикла |

## 8. Сгорание, заморозка, неоплаченное продление

| № | Правило |
|---|---|
| З1 | Замороженные токены не участвуют в доступном балансе, но остаются закреплены за пользователем |
| З2 | Замороженный остаток виден пользователю с указанием, что вернётся при возобновлении подписки |
| З3 | Разморозка автоматическая, в момент успешной оплаты |
| З4 | Замороженные купленные токены срока истечения не имеют |

### Неоплаченное продление

Отсчёт от даты окончания оплаченного периода.

| День | Доступ | Тарифные | Купленные |
|---|---|---|---|
| 0 | платные функции работают | активны, транш начисляется | активны |
| 1–3 | платные функции отключены | заморожены | заморожены |
| 4 | Free | **сгорают** | **остаются заморожены** |

| № | Правило |
|---|---|
| З5 | В дни 1–3 ничего не сгорает — подписка ещё жива |
| З6 | Восстановление платежа в дни 0–3: всё размораживается, пропущенный транш начисляется |
| З7 | Оплата после дня 4: новый транш, купленные размораживаются |

## 9. Возвраты средств и изменение цен

### Возврат средств

| Ситуация | Поведение |
|---|---|
| Пакет не израсходован | Возврат средств, изъятие токенов пакета |
| Пакет израсходован частично | Возврат пропорционально неизрасходованному, изъятие остатка |
| Пакет израсходован полностью | Возврат по решению поддержки, фиксируется как убыток |
| Подписка внутри периода | Подписка закрывается: тарифные сгорают, купленные замораживаются |
| Подписка после нескольких траншей | Возврат за неиспользованные месяцы; токены начисленных траншей не изымаются |

| № | Правило |
|---|---|
| В1 | Изъятие не уводит баланс в минус: изымается доступный остаток, разница — убыток |
| В2 | Оспаривание платежа по подписке — немедленное закрытие, без окна из раздела 8 |
| В3 | Оспаривание по пакету — изъятие неизрасходованного остатка |
| В4 | Пользователь с оспариванием помечается; факт фиксируется, даже когда изымать нечего |

### Изменение стоимости операций

| № | Правило |
|---|---|
| В5 | Повышение действует для всех запусков после даты вступления в силу |
| В6 | **Владельцам купленных токенов начисляется компенсация**, восстанавливающая покупательную способность по подорожавшей операции. Тарифные и бонусные не компенсируются — их потери ограничены одним циклом |
| В7 | Понижение стоимости изъятием не сопровождается |
| В8 | О повышении пользователи уведомляются заранее |

## 10. Баланс и отображение

| № | Правило |
|---|---|
| О1 | Баланс — целое число токенов, отрицательным не бывает |
| О2 | Баланс виден постоянно, не только при исчерпании |
| О3 | Стоимость операции показывается до запуска |
| О4 | Прайс-лист доступен пользователю целиком |
| О5 | Объём токенов указывается в составе тарифа явно |
| О6 | Замороженные — отдельной строкой, с доступными не суммируются |
| О7 | Пользователю доступна история баланса: начисления, списания, сгорания, заморозки |

## 11. Учёт

| № | Правило |
|---|---|
| У1 | Система в любой момент объясняет, из чего сложился баланс: все начисления, списания, возвраты, сгорания |
| У2 | Баланс напрямую не редактируется. Любое изменение — результат зафиксированной операции |
| У3 | Отмена ошибочной операции — обратной операцией, не удалением |
| У4 | Каждая операция связана с породившим объектом: платёж, запуск операции, пакет, обращение в поддержку |
| У5 | Повторная обработка одного события не создаёт вторую операцию |
| У6 | Ручная корректировка фиксирует оператора и причину |
| У7 | Каждая выполненная операция и каждый обмен сообщениями фиксируются с привязкой к пользователю и тарифу — это данные для расчёта себестоимости и маржи по переменным `*_COGS`. Пользователю не показывается |

## 13. Метрики

### Тарифная лестница

| Показатель | Как читать |
|---|---|
| **Доля Premium, регулярно покупающих пакеты** | Высокая при отсутствии переходов на VIP → нарушено Т4, докупка выгоднее апгрейда |
| Переходы Premium → VIP против покупок пакетов на Premium | Прямая мера работоспособности лестницы |
| Фактическая цена токена по сегментам | Сколько пользователь реально платит с учётом пакетов |

### Калибровка объёма тарифа

| Показатель | Как читать |
|---|---|
| **Доля исчерпавших транш** | Низкая — объём велик, пакеты не продаются. Высокая — тариф неполноценен |
| Доля сгоревших токенов | Высокая — объём избыточен, портит восприятие при продлении |
| Медиана расхода за цикл, по тарифам и периодам | Основа для `TARGET_COVERAGE_PCT` |
| Распределение расхода по операциям | Основа для пересмотра цен прайс-листа |
| Конверсия нехватки в покупку пакета | Эффективность точки продажи |
| Доля выручки от пакетов | Работает ли докупка вообще |

### Маржа

Считается на переменных `*_COGS`. Пользователю ничего из этого блока не показывается.

| Показатель | Формула |
|---|---|
| **Маржа операции** | стоимость в токенах × фактическая цена токена сегмента − `*_COGS`. Выявляет операции, продаваемые ниже себестоимости |
| Себестоимость пользователя за период | Σ (выполненные операции × их `*_COGS`) + сообщения × `MESSAGE_COGS` |
| **Маржа тарифа** | цена тарифа − средняя себестоимость пользователя этого тарифа. Разрез тариф × период |
| **Доля убыточных платных** | Доля пользователей, чья себестоимость за период превысила цену тарифа. Порог тревоги `UNPROFITABLE_SHARE_ALERT` |
| Распределение маржи p10/p50/p90 | Среднее непоказательно — тяжёлые пользователи его смещают |

Контур управления: маржа операции корректируется переменной `*_COST` (цена в токенах), маржа тарифа — объёмом транша и ценами тарифов. Себестоимости `*_COGS` при этом — измеряемый вход, а не рычаг.

### Бонус и заморозка

| Показатель | Как читать |
|---|---|
| Себестоимость бонусов на одну оплату | По вариантам эксперимента. Ограничитель политики бонуса |
| Объём замороженных токенов | Отложенное обязательство |
| **Возвраты с замороженным остатком против возвратов без него** | Прямая проверка, работает ли заморозка как механика возврата |

## 14. Порядок настройки

| Шаг | Действие |
|---|---|
| 1 | Составить прайс-лист, определить себестоимость операций |
| 2 | Выбрать номинал |
| 3 | Заполнить доступность операций по тарифам |
| 4 | Задать цены и объёмы, рассчитать цену токена, проверить Т1–Т5 |
| 5 | Задать пакеты, проверить Т1, Т5, П2, П3, **особенно Т4** |
| 6 | Запустить, накопить 1–2 цикла |
| 7 | Калибровать объёмы по доле исчерпавших и сгоревших |
| 8 | Проверить лестницу: покупают VIP или докупают пакеты |
| 9 | Проверить долю убыточных; при превышении порога — к шагу 4 |

Шаги 7–9 — постоянный цикл.
