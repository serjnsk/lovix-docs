# Пресеты сценариев чата

Сценарий это готовая кнопка старта диалога в карточке бота: наименование и пояснение. Документ описывает сущность сценария, автоматический подбор сценариев под каждого бота, массовую генерацию и управление в админке.

Живьём: [демо раздела админки](scenario-presets-demo.html) · [демо создания сценариев](scenario-wizard-demo.html).

## Схема

Кликни и потаскай холст, колесо — зум.

## Сущность сценария

| ID | Правило |
|---|---|
| С1 | Сценарий состоит из наименования и пояснения и хранит переводы на ru, en, de. Пользователю показывается версия его локали. |
| С2 | Сценарий относится к одному из трёх видов, вид определяет его условия показа и слот: **категорийный** несёт условия по параметрам бота (пол, возраст, род занятий, этничность, стиль и прочие характеристики из общего словаря), **локальный** несёт список локалей (ru, en, de), **универсальный** условий не имеет и подходит любому боту. |
| С3 | Локали настраиваются только у локальных сценариев. Категорийные и универсальные показываются во всех локалях, пользователь видит перевод своей локали. |
| С4 | Условия по параметрам соединяются через **И**. Внутри одного параметра допустим список значений: «род занятий: секретарша или горничная». |
| С5 | У сценария есть признак **spicy**. Spicy показываются всем, использовать их может пользователь с активной подпиской. |
| С6 | **Даты активности с и по** ограничивают период показа. Вне периода сценарий в наборы не попадает. |
| С7 | Наименование и пояснение не редактируются. Неудачный сценарий выключают или удаляют, вместо него генерируют новый. |

## Подбор сценариев на бота

| ID | Правило |
|---|---|
| М1 | У бота 12 слотов: 6 обычных и 6 spicy. Внутри каждой шестёрки 2 слота занимают сценарии, подобранные по параметрам бота, 2 — сценарии локали пользователя, 2 — универсальные. |
| М2 | Кандидат на слот проходит, если совпали все его условия показа: параметры бота для слотов по параметрам, локаль пользователя для локальных слотов, признак универсального для универсальных. |
| М3 | Кандидатов больше, чем слотов: выигрывает сценарий с большим числом совпавших условий. |
| М4 | При равной точности выигрывает сценарий, закреплённый за **наименьшим числом ботов**. При равных счётчиках выбор случайный. Так новые сценарии расходятся по базе, а наборы разных ботов отличаются. |
| М5 | Один сценарий занимает у бота **не больше одного слота**. |
| М6 | Подходящих сценариев не хватило на слоты своего вида — слот заполняется универсальным. У бота всегда 12 кнопок. |
| М7 | Наборы хранятся готовыми, карточка бота открывается без вычислений. |
| М8 | Наборы пересобираются **раз в неделю**, а также внепланово: при изменении параметров бота, при публикации или удалении сценариев, при наступлении или окончании дат активности. Между пересборками набор бота одинаков для всех пользователей независимо от аккаунта и времени захода. |

## Массовая генерация

| ID | Правило |
|---|---|
| В1 | Форма запуска: вид сценария, формат (обычные или spicy), условия показа, даты активности, дополнительный контекст, язык, количество. |
| В2 | Набор полей на шаге условий зависит от вида: у категорийного задаются параметры бота, у локального список локалей, у универсального условий нет. |
| В3 | Выбор категории подставляет её параметры в условия, дальше условия правятся и дополняются вручную. |
| В4 | У обычных и spicy сценариев **разные промпты генерации**. Промпты заданы в системе. |
| В5 | Генерация идёт фоном пачкой. По окончании доступен отчёт: создано, отброшено дублей. |
| В6 | Сценарий, близкий по смыслу к существующему в пуле, в черновики не попадает. |
| В7 | Сгенерированное попадает в черновики. В общий пул сценарий уходит после апрува, апрув возможен пачкой. |

## Раздел в админке

| ID | Правило |
|---|---|
| А1 | Список всех сценариев с фильтрами по виду, spicy, локали, статусу и датам. Условия показа выводятся в читаемом виде. |
| А2 | Действия над сценарием: включить, выключить, удалить. |
| А3 | Массовые действия: чекбоксы в строках, выделение нескольких сценариев, выделение всего в пределах текущего фильтра. Над выбранными доступны включить, выключить и удалить одной кнопкой, рядом счётчик выбранных. |
| А4 | По каждому сценарию показы и клики за период. |
| А5 | Вкладка черновиков: апрув и удаление пачкой, подозрительные дубли помечены. |
| А6 | Вкладка **«Проверка на боте»**: выбранный бот показывает свои 12 слотов с пояснением, по какому условию туда попал каждый сценарий. Локаль пользователя переключается. |
| А7 | Вкладка **«Покрытие ботов»**: таблица всех ботов с их параметрами и категориями. По каждой локали видно, сколько сценариев подобралось боту, отдельно обычных и spicy. Боты, которым не хватило сценариев своего вида, помечены; фильтр показывает только их. Строка открывает разбор набора этого бота. |

## Миграция

Существующие сценарии переносятся в пул как универсальные, без условий по параметрам. Дальше они отсеиваются по показам и кликам.

## Критерии приёмки

- У любого бота 12 кнопок: 6 обычных и 6 spicy, в каждой шестёрке 2 по параметрам, 2 по локали, 2 универсальных.
- Бот «женщина, 42, секретарша» получает сценарии, подходящие этим параметрам, и не получает сценарии других типажей.
- Пользователь с локалью de видит локальные сценарии для de, а категорийные и универсальные независимо от локали; тексты всех сценариев на немецком.
- В форме генерации категорийного вида нет выбора локалей, у локального нет выбора параметров бота.
- Два пользователя с разных аккаунтов видят у одного бота одинаковый набор; набор не меняется до ближайшей пересборки.
- Пересборка проходит раз в неделю и дополнительно после изменения параметров бота, публикации или удаления сценариев.
- Новый сценарий после апрува попадает к ботам с наименьшими счётчиками привязок и расходится по базе.
- У бота нет двух одинаковых кнопок.
- Подходящих сценариев вида меньше двух: слот заполнен универсальным, кнопок по-прежнему 12.
- Сценарий с датами активности не показывается до даты начала и пропадает после даты окончания.
- Выключенный или удалённый сценарий исчезает из наборов после пересборки, пустого места не остаётся.
- Пачка на 50 сценариев уходит в фон, по завершении доступен отчёт со счётчиком дублей, результат лежит в черновиках.
- Черновик до апрува не попадает ни в один набор.
- Генерация spicy использует отдельный промпт.
- В списке можно выделить несколько сценариев и одной кнопкой включить, выключить или удалить их; счётчик совпадает с числом отмеченных строк.
- Выделение всего отмечает только то, что показывает текущий фильтр.
- В списке видно показы и клики за выбранный период.
- В «Проверке на боте» для каждого из 12 слотов указано, по какому условию сценарий туда попал.
- В «Покрытии ботов» за один экран видно, каким ботам не хватает сценариев и по какой локали.

<script>
  const raw = document.getElementById("src").textContent;
  document.getElementById("out").innerHTML = marked.parse(raw, {gfm:true});


  document.querySelectorAll("#out table td, #out p, #out li").forEach(td => {
    if (/[\u{1F514}\u2709\u{1F4AC}\u{1F7E3}]/u.test(td.textContent)) {
      td.innerHTML = td.innerHTML
        .replace(/🔔/g, '<span class="ch ch-bell"><i>🔔</i>колокольчик</span>')
        .replace(/✉/g, '<span class="ch ch-mail"><i>✉️</i>email</span>')
        .replace(/💬/g, '<span class="ch ch-chat"><i>💬</i>чат компаньона</span>')
        .replace(/🟣/g, '<span class="ch ch-widget"><i>🟣</i>лайв-виджет</span>')
        .replace(/<\/span> \+ <span/g, '</span> <span');
    }
  });

  document.querySelectorAll("#out table").forEach(tb => {
    const heads = [...tb.querySelectorAll("th")].map(th => th.textContent.trim());
    const cutIdx = heads.indexOf("Разрезы");
    let evIdx = heads.indexOf("События-источники");
    if (evIdx < 0) evIdx = heads.indexOf("Источник");
    tb.querySelectorAll("tr").forEach(tr => {
      const tds = tr.children;
      if (cutIdx >= 0 && tds[cutIdx] && tds[cutIdx].tagName === "TD") {
        const txt = tds[cutIdx].textContent.trim();
        if (txt && txt !== "—")
          tds[cutIdx].innerHTML = txt.split(",").map(p => '<span class="chip-cut">' + p.trim() + "</span>").join("");
      }
      if (evIdx >= 0 && tds[evIdx] && tds[evIdx].tagName === "TD") {
        tds[evIdx].innerHTML = tds[evIdx].innerHTML
          .replace(/Keitaro/g, '<span class="chip-ext">Keitaro</span>')
          .replace(/Я\.Метрика/g, '<span class="chip-ext">Я.Метрика</span>');
      }
    });
  });


(function(){
  const main = document.querySelector("main");
  const toc = document.getElementById("toc");
  const heads = main.querySelectorAll(".md h2, .md h3, .proto-label b");
  let n = 0;
  const t = document.createElement("div"); t.className = "toc-t"; t.textContent = "На этой странице"; toc.appendChild(t);
  const items = [];
  let curSub = null, curParent = null;
  heads.forEach(h => {
    const proto = h.closest(".proto");
    const target = proto || h;
    if (!target.id) target.id = "sec-" + (n++);
    target.style.scrollMarginTop = "70px";
    const a = document.createElement("a");
    a.href = "#" + target.id;
    a.textContent = proto ? "Прототип: " + h.textContent : h.textContent;
    const isChild = (h.tagName === "H3" && !proto);
    if (isChild) {
      a.className = "h3";
      if (!curSub) {
        curSub = document.createElement("div"); curSub.className = "toc-sub";
        toc.appendChild(curSub);
        if (curParent) curParent.sub = curSub;
      }
      curSub.appendChild(a);
      items.push({target, a, parent: curParent});
    } else {
      curSub = null;
      const row = document.createElement("div"); row.className = "toc-row";
      row.appendChild(a); toc.appendChild(row);
      const it = {target, a, row, sub: null, tgl: null};
      curParent = it; items.push(it);
    }
  });
  items.forEach(it => {
    if (it.sub) {
      const b = document.createElement("button"); b.className = "toc-tgl"; b.textContent = "\u25B6";
      b.addEventListener("click", () => {
        const open = it.sub.classList.toggle("open");
        b.classList.toggle("open", open);
      });
      it.row.appendChild(b); it.tgl = b;
    }
  });
  function setOpen(it, open){
    if (it && it.sub){ it.sub.classList.toggle("open", open); it.tgl.classList.toggle("open", open); }
  }
  let lastOwner = null;
  function onScroll(){
    let cur = items[0];
    for (const it of items) {
      if (it.target.getBoundingClientRect().top <= 90) cur = it; else break;
    }
    items.forEach(it => it.a.classList.toggle("active", it === cur));
    const owner = cur ? (cur.parent || cur) : null;
    if (owner !== lastOwner) { setOpen(owner, true); lastOwner = owner; }
  }
  addEventListener("scroll", onScroll, {passive:true}); onScroll();
})();

<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
(function(){
  function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}

  // Scenario details come from the page's own summary table — zero duplication.
  const data = {};
  document.querySelectorAll("#out table").forEach(t => {
    const first = t.querySelector("tr th, tr td");
    if (!first || first.textContent.trim() !== "ID") return;
    t.querySelectorAll("tr").forEach((tr, i) => {
      if (i === 0) return;
      const c = tr.cells;
      if (!c || c.length < 7) return;
      const id = c[0].textContent.replace(/🆕/g, "").trim();
      data[id] = {ev: c[1].innerHTML, when: c[2].textContent.trim(), ch: c[3].innerHTML,
                  what: c[4].textContent.trim(), skip: c[5].textContent.trim(), rep: c[6].textContent.trim()};
    });
  });

  const panel = document.getElementById("vzpanel");
  function show(id){
    const d = data[id];
    if (!d || !panel) return;
    panel.innerHTML = "<b>" + esc(id) + " · " + esc(d.what) + "</b>" +
      '<div class="vzgrid">' +
      "<span>Событие / триггер</span><span>" + d.ev + "</span>" +
      "<span>Когда</span><span>" + esc(d.when) + "</span>" +
      "<span>Канал</span><span>" + d.ch + "</span>" +
      "<span>Не отправлять, если</span><span>" + esc(d.skip) + "</span>" +
      "<span>Повтор</span><span>" + esc(d.rep) + "</span>" +
      '</div><span class="vzgo">Показать тексты ↓</span>';
    panel.querySelector(".vzgo").addEventListener("click", () => {
      // Content tables have 5 columns (ID|Канал|Сообщение|CTA|Мерим); summary has 7.
      const tables = Array.from(document.querySelectorAll("#out table")).filter(t => {
        const h = t.querySelectorAll("thead th");
        return h.length === 5 && h[0].textContent.trim() === "ID";
      });
      for (const t of tables) {
        const row = Array.from(t.querySelectorAll("tr")).find(tr =>
          tr.cells && tr.cells[0] && tr.cells[0].tagName === "TD" &&
          tr.cells[0].textContent.replace(/🆕/g, "").trim().startsWith(id));
        if (row) {
          row.scrollIntoView({behavior: "smooth", block: "center"});
          row.classList.remove("vzflash");
          void row.offsetWidth;
          row.classList.add("vzflash");
          return;
        }
      }
      // No table row (e.g. У7-1 — generated text): jump to the group heading.
      const grp = id.split("-")[0] + ".";
      const h2 = Array.from(document.querySelectorAll("#out h2"))
        .find(h => h.textContent.trim().startsWith(grp));
      if (h2) h2.scrollIntoView({behavior: "smooth"});
    });
    panel.scrollIntoView({behavior: "smooth", block: "nearest"});
  }

  mermaid.initialize({startOnLoad: false, securityLevel: "loose", theme: "neutral",
    flowchart: {curve: "basis", htmlLabels: true, useMaxWidth: false}});
  mermaid.run({nodes: document.querySelectorAll("pre.mermaid")}).then(() => {
    document.querySelectorAll(".mermaid g.node").forEach(n => {
      const m = n.textContent.match(/У\d+-\d+/);
      if (!m || !data[m[0]]) return;
      n.classList.add("vz-click");
      n.addEventListener("click", () => show(m[0]));
    });

    // Miro-like canvas: drag to pan, wheel / pinch to zoom, buttons for fit/100%/±.
    document.querySelectorAll(".vzwrap").forEach(wrap => {
      const pre = wrap.querySelector("pre.mermaid");
      const svg = pre && pre.querySelector("svg");
      if (!svg) return;
      let k = 1, tx = 0, ty = 0, mode = "", interacted = false;
      function nat(){
        const t = svg.style.transform;
        svg.style.transform = "none";
        const r = svg.getBoundingClientRect();
        svg.style.transform = t;
        return {w: r.width, h: r.height};
      }
      function box(){
        // Hidden tab / collapsed pane can report a 0-height viewport; fall
        // back to sane defaults so fit() never collapses to the min zoom.
        const W = wrap.clientWidth || 960, H = wrap.clientHeight || 480;
        return {W: Math.max(W, 320), H: Math.max(H, 320)};
      }

      const tools = document.createElement("div");
      tools.className = "vztools";
      tools.innerHTML = '<button data-z="fit">Вписать</button>' +
        '<button data-z="1">100%</button><button data-z="-">−</button>' +
        '<button data-z="+">+</button><span class="vzk"></span>' +
        '<span class="vzhint">двигай мышью · зум колесом</span>';
      wrap.appendChild(tools);
      const lbl = tools.querySelector(".vzk");

      function apply(){
        svg.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + k + ")";
        lbl.textContent = Math.round(k * 100) + "%";
        tools.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.z === mode));
      }
      function clamp(v){ return Math.min(3, Math.max(0.1, v)); }
      function zoomAt(cx, cy, f, m){
        const nk = clamp(k * f);
        tx = cx - (cx - tx) * (nk / k);
        ty = cy - (cy - ty) * (nk / k);
        k = nk; mode = m || ""; apply();
      }
      function fit(){
        const b = box(), n = nat();
        k = clamp(Math.min((b.W - 24) / n.w, (b.H - 24) / n.h));
        tx = (b.W - n.w * k) / 2; ty = (b.H - n.h * k) / 2;
        mode = "fit"; apply();
      }
      function hundred(){
        const b = box(), n = nat();
        k = 1; tx = (b.W - n.w) / 2; ty = (b.H - n.h) / 2;
        mode = "1"; apply();
      }
      tools.addEventListener("click", e => {
        const z = e.target.dataset && e.target.dataset.z;
        if (!z) return;
        e.stopPropagation();
        interacted = true;
        if (z === "fit") fit();
        else if (z === "1") hundred();
        else zoomAt(wrap.clientWidth / 2, wrap.clientHeight / 2, z === "+" ? 1.25 : 0.8);
      });

      wrap.addEventListener("wheel", e => {
        e.preventDefault();
        interacted = true;
        const r = wrap.getBoundingClientRect();
        zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015));
      }, {passive: false});

      wrap.addEventListener("dblclick", e => {
        if (e.target.closest("g.node") || e.target.closest(".vztools")) return;
        const r = wrap.getBoundingClientRect();
        zoomAt(e.clientX - r.left, e.clientY - r.top, 1.5);
      });

      // Pointers: 1 finger/button = pan, 2 fingers = pinch. Click passes through
      // only when the pointer barely moved.
      const pts = new Map();
      let moved = false, suppressClick = false, pin = null, start = null;
      wrap.addEventListener("pointerdown", e => {
        if (e.target.closest(".vztools")) return;
        // No pointer capture yet: capturing here would retarget the follow-up
        // click to the canvas and node clicks would never fire. Capture only
        // once an actual drag starts (threshold crossed) or a pinch begins.
        interacted = true;
        pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
        if (pts.size === 1) { moved = false; suppressClick = false; start = {x: e.clientX, y: e.clientY}; }
        if (pts.size === 2) { try { wrap.setPointerCapture(e.pointerId); } catch(_){} }
        pin = null;
      });
      wrap.addEventListener("pointermove", e => {
        if (!pts.has(e.pointerId)) return;
        const prev = pts.get(e.pointerId);
        pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
        const r = wrap.getBoundingClientRect();
        if (pts.size === 1) {
          if (!moved && start && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 5) return;
          if (!moved) { try { wrap.setPointerCapture(e.pointerId); } catch(_){} }
          moved = true;
          wrap.classList.add("dragging");
          tx += e.clientX - prev.x; ty += e.clientY - prev.y; mode = ""; apply();
        } else if (pts.size === 2) {
          const [a, b] = Array.from(pts.values());
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          const mid = {x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top};
          if (pin) {
            zoomAt(mid.x, mid.y, dist / pin.dist);
            tx += mid.x - pin.mid.x; ty += mid.y - pin.mid.y; apply();
          }
          pin = {dist: dist, mid: mid};
          moved = true;
        }
      });
      function release(e){
        if (!pts.has(e.pointerId)) return;
        pts.delete(e.pointerId);
        pin = null;
        if (pts.size === 0) {
          wrap.classList.remove("dragging");
          if (moved) suppressClick = true;
        }
      }
      wrap.addEventListener("pointerup", release);
      wrap.addEventListener("pointercancel", release);
      wrap.addEventListener("click", e => {
        if (suppressClick) { suppressClick = false; e.stopPropagation(); e.preventDefault(); }
      }, true);

      // Initial fit; re-fit when the canvas gets its real size (hidden tab,
      // pane resize, late font layout) until the user pans/zooms themselves.
      fit();
      [120, 400, 900].forEach(ms => setTimeout(() => { if (!interacted) fit(); }, ms));
      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(() => { if (!interacted) fit(); }).observe(wrap);
      }
    });
  });
})();
</script>
