# Сценарии взаимодействия с пользователем

Сценарий: **случилось [событие](events.html) → отправили сообщение → ждём целевое действие.** Если действие уже совершено — сообщение не отправляется (колонка «Отмена»).

Тексты в таблицах — смысл сообщения. Финальные формулировки пишутся отдельно.

## Каналы

| Канал | Обозначение | Что умеет | Ограничение |
|---|---|---|---|
| Колокольчик | 🔔 | Центр уведомлений в шапке продукта | Доставляет только когда пользователь **уже зашёл** — канал сопровождения, не возврата |
| Email | ✉ | Единственный канал возврата ушедшего | **Отправляем по всей базе, включая неподтверждённые адреса** — подтверждение не гейт |
| Чат компаньона | 💬 | **Проактивное сообщение от компаньона** — в продукте появляется непрочитанное | Два режима: **скрипт** (фиксированный текст, Free-сценарии) и **контекст** (генерация из истории диалога, платные). Сообщение компаньона не расходует лимиты пользователя |
| Телеграм-бот | — | Подключается позже | Структура каналов расширяема, триггеры не переписываются |

Email идёт на адрес регистрации **независимо от подтверждения** — сейчас почти вся база не подтверждена, и это осознанное решение работать со всей базой. Подтверждение (`auth.email_verified`) остаётся целью сценария У1-1, но как фактор качества: неподтверждённые адреса дают больше отказов и жалоб, что бьёт по репутации домена отправки — bounces и жалобы надо отслеживать.

## Типы

**Т — транзакционное**: деньги, доступ, токены. **М — маркетинговое**: продажа и возврат.

## Квоты по каналам

Лимиты — свойство канала, не системы. Каждый канал считает свои независимо.

| Канал | Т — транзакционные | М — маркетинговые | Тихие часы |
|---|---|---|---|
| 🔔 колокольчик | без ограничений | **без ограничений — идут все** | нет |
| ✉ email | без ограничений | максимум 1 в сутки и 4 в неделю | 22:00–09:00 по локали, М переносятся на утро |
| 💬 чат компаньона | — | не чаще 1 проактива в сутки | нет |

## Конфликты

Приоритетов нет: суточный email-слот занимает сценарий, **сработавший первым**.

| № | Правило |
|---|---|
| К1 | Конкуренция существует только в каналах с лимитом — то есть в email. Колокольчик доставляет все сообщения |
| К2 | Неактивированные сообщения — не отправленные из-за занятого слота — **отбрасываются, не копятся**: отложенное устаревает и раздражает. Их колокольчик-версия, если есть, доставляется всё равно |
| К3 | Транзакционные в конкуренции не участвуют — уходят все, во всех каналах |

## Правила доставки

| № | Правило |
|---|---|
| Д1 | **Условие отмены проверяется перед отправкой**, а не только при постановке. Оплатил через 20 минут — письмо о брошенной корзине не уходит |
| Д2 | **Стоп после конверсии**: достижение целевого действия отменяет неотправленные сообщения серии |
| Д3 | Один сценарий — не чаще, чем указано в его колонке «Повтор» |
| Д4 | Email отправляется по всей базе независимо от подтверждения почты. Адреса с bounce или жалобой на спам — исключаются из рассылок навсегда |
| Д5 | Каждая отправка и каждый отказ от отправки логируются с причиной |
| Д6 | Язык сообщения — язык локали пользователя |
| Д7 | Отписка отключает маркетинговые **категориями** (продажи / возврат), не всё разом. Транзакционные не отключаемы |

## У1. Регистрация и активация

Точки взаимодействия первого касания после регистрации. Цель группы — довести нового пользователя до стены: стена — момент продажи, и не дошедший до неё предложения не видел.

| ID | Тип | Событие | Когда | Канал | Суть сообщения | Отмена | Повтор |
|---|---|---|---|---|---|---|---|
| У1-1 | Т | `auth.signup_completed` | Сразу | ✉ | Подтвердите почту — письмо на адрес регистрации | `auth.email_verified` | 1 повтор через 24 ч |
| У1-2 | М | `auth.signup_completed` | Сразу | 🔔 | Приветствие: с чего начать — выбрать компаньона из каталога | — | однократно |
| У1-3 | М | `trial.granted` | Сразу | 🔔 | Вам доступны пробные операции: состав набора. **Спит, пока пробный набор пуст** (токеномика, раздел 5) | — | однократно на выдачу |
| У1-4 | М | планировщик: **1 час неактивности** после регистрации, квота не исчерпана | +1 ч | 💬 + ✉ | Реактивация. Общался — проактив последнего компаньона + письмо «вас ждёт непрочитанное сообщение» (механика У2-2). Не начал — письмо «компаньоны ждут знакомства» в каталог | активность или оплата | однократно |

## У2. Стены и токены — продажа

| ID | Тип | Событие | Когда | Канал | Суть сообщения | Отмена | Повтор |
|---|---|---|---|---|---|---|---|
| У2-1 | М | `quota.message_blocked` | Сразу | 🔔 | **Стена Free**: сообщение не отправлено — продолжить без ограничений на платном | оплата | 1 раз на период квоты |
| У2-2 | М | `quota.message_blocked` | Через 1 ч без оплаты | 💬 + ✉ | **Возврат со стены — главная точка потерь воронки.** Двойная реакция: последний компаньон, с которым общался пользователь, отправляет заскриптованное проактивное сообщение в чат — появляется непрочитанное; следом письмо «вас ждёт непрочитанное сообщение от <имя компаньона>». Вернувшийся читает, пробует ответить — и снова упирается в стену с пейволлом | оплата | 1 раз на период квоты |
| У2-3 | М | `message_limit.reached` tier = premium | Сразу | 🔔 | Дневной лимит: перейти на VIP или подождать до завтра | апгрейд | 1 раз в сутки |
| У2-4 | Т | `message_limit.reached` tier = vip | Сразу | 🔔 | Подождите до завтра. **Без апсейла — тарифа выше нет** | — | 1 раз в сутки |
| У2-5 | М | `trial.used` остаток = 0 | Сразу | 🔔 | Исчерпан **пробный набор Free** — разовые пробные операции (например, 1 фото + 1 аудио), выдаваемые при регистрации и даунгрейде (токеномика, раздел 5). Сообщение: пробы закончились, что даёт подписка. **Сейчас набор пуст — сценарий спит** | оплата | однократно на выдачу набора |
| У2-6 | М | `tokens.blocked_action` | Через 1 ч без покупки | ✉ | Не хватило токенов на операцию: пакет, вторым вариантом VIP | покупка пакета или апгрейд | не чаще 1 раза в сутки |
| У2-7 | М | `tokens.balance_low` | Сразу | 🔔 | Токены на исходе: остаток и предложение пакета | пополнение | 1 раз на цикл |
| У2-8 | М | `tokens.expiring_soon` | За `EXPIRY_WARNING_DAYS` | 🔔 | Сгорит N токенов через N дней. **Только тарифные — купленные не упоминать** | остаток потрачен | 1 раз на цикл |

Пейволлы на месте отказа (`paywall.shown`, `vip_feature.clicked` → экран апгрейда) — мгновенные интерфейсные сценарии; они вне капов и этого контура доставки.

## У4. Окно восстановления платежа

Все транзакционные. Дни — из токеномики: день 0 полный доступ, дни 1–3 грейс, день 4 бесплатный тариф. В каждом сообщении — оставшееся время до следующего шага.

| ID | Тип | Событие | Когда | Канал | Суть сообщения | Отмена | Повтор |
|---|---|---|---|---|---|---|---|
| У4-1 | Т | `subscription.past_due_started` | День 0 | ✉ + 🔔 | Не смогли списать (причина по коду). **Всё работает, время до завтра** | списание прошло | однократно |
| У4-2 | Т | `subscription.grace_started` | День 1 | ✉ + 🔔 | **Лимит снова 5/мес.** Токены и компаньоны сохранены, вернём после оплаты. Осталось 3 дня | списание прошло | однократно |
| У4-3 | Т | планировщик | День 3 | ✉ | Завтра переключим на бесплатный тариф — последняя возможность | списание прошло | однократно |
| У4-4 | Т | `subscription.reverted_to_free` | День 4 | ✉ | Вы на бесплатном. **N токенов заморожено и ждёт**, компаньоны на месте | — | однократно |

## У5. Продления

Принцип: **пользователям с включённым автопродлением напоминания о продлении не отправляются** — лишние сообщения о предстоящем списании провоцируют отмены. Напоминание получают только те, у кого доступ закончится сам по себе.

| ID | Тип | Событие | Когда | Канал | Суть сообщения | Отмена | Повтор |
|---|---|---|---|---|---|---|---|
| У5-1 | — | `subscription.renewal_due`, автопродление **включено** | — | — | **Не отправляется ничего**, любые периоды и способы | — | — |
| У5-2 | Т | `subscription.renewal_due`, автопродление **отключено** или разовый способ оплаты (крипта) | За 1 день до окончания доступа | ✉ + 🔔 | Завтра доступ закончится: крипта — оплатить вручную, карта — включить автопродление | оплата или включение автопродления | однократно |
| У5-3 | Т | `subscription.renewed` | Сразу | ✉ | Чек продления | — | на каждое |

<script>
  const raw = document.getElementById("src").textContent;
  document.getElementById("out").innerHTML = marked.parse(raw, {gfm:true});


  document.querySelectorAll("#out table td, #out p, #out li").forEach(td => {
    if (/[\u{1F514}\u2709\u{1F4AC}]/u.test(td.textContent)) {
      td.innerHTML = td.innerHTML
        .replace(/🔔/g, '<span class="ch ch-bell"><i>🔔</i>колокольчик</span>')
        .replace(/✉/g, '<span class="ch ch-mail"><i>✉️</i>email</span>')
        .replace(/💬/g, '<span class="ch ch-chat"><i>💬</i>чат компаньона</span>')
        .replace(/<\/span> \+ <span/g, '</span> <span');
    }
  });

  document.querySelectorAll("#out table").forEach(tb => {
    const heads = [...tb.querySelectorAll("th")].map(th => th.textContent.trim());
    const cutIdx = heads.indexOf("Разрезы");
    let evIdx = heads.indexOf("События-источники");
    if (evIdx < 0) evIdx = heads.indexOf("Источник");
    tb.querySelectorAll("tr").forEach(tr => {
      const tds = tr.children;
      if (cutIdx >= 0 && tds[cutIdx] && tds[cutIdx].tagName === "TD") {
        const txt = tds[cutIdx].textContent.trim();
        if (txt && txt !== "—")
          tds[cutIdx].innerHTML = txt.split(",").map(p => '<span class="chip-cut">' + p.trim() + "</span>").join("");
      }
      if (evIdx >= 0 && tds[evIdx] && tds[evIdx].tagName === "TD") {
        tds[evIdx].innerHTML = tds[evIdx].innerHTML
          .replace(/Keitaro/g, '<span class="chip-ext">Keitaro</span>')
          .replace(/Я\.Метрика/g, '<span class="chip-ext">Я.Метрика</span>');
      }
    });
  });


(function(){
  const main = document.querySelector("main");
  const toc = document.getElementById("toc");
  const heads = main.querySelectorAll(".md h2, .md h3, .proto-label b");
  let n = 0;
  const t = document.createElement("div"); t.className = "toc-t"; t.textContent = "Оглавление"; toc.appendChild(t);
  const items = [];
  let curSub = null, curParent = null;
  heads.forEach(h => {
    const proto = h.closest(".proto");
    const target = proto || h;
    if (!target.id) target.id = "sec-" + (n++);
    target.style.scrollMarginTop = "70px";
    const a = document.createElement("a");
    a.href = "#" + target.id;
    a.textContent = proto ? "Прототип: " + h.textContent : h.textContent;
    const isChild = (h.tagName === "H3" && !proto);
    if (isChild) {
      a.className = "h3";
      if (!curSub) {
        curSub = document.createElement("div"); curSub.className = "toc-sub";
        toc.appendChild(curSub);
        if (curParent) curParent.sub = curSub;
      }
      curSub.appendChild(a);
      items.push({target, a, parent: curParent});
    } else {
      curSub = null;
      const row = document.createElement("div"); row.className = "toc-row";
      row.appendChild(a); toc.appendChild(row);
      const it = {target, a, row, sub: null, tgl: null};
      curParent = it; items.push(it);
    }
  });
  items.forEach(it => {
    if (it.sub) {
      const b = document.createElement("button"); b.className = "toc-tgl"; b.textContent = "\u25B6";
      b.addEventListener("click", () => {
        const open = it.sub.classList.toggle("open");
        b.classList.toggle("open", open);
      });
      it.row.appendChild(b); it.tgl = b;
    }
  });
  function setOpen(it, open){
    if (it && it.sub){ it.sub.classList.toggle("open", open); it.tgl.classList.toggle("open", open); }
  }
  let lastOwner = null;
  function onScroll(){
    let cur = items[0];
    for (const it of items) {
      if (it.target.getBoundingClientRect().top <= 90) cur = it; else break;
    }
    items.forEach(it => it.a.classList.toggle("active", it === cur));
    const owner = cur ? (cur.parent || cur) : null;
    if (owner !== lastOwner) { setOpen(owner, true); lastOwner = owner; }
  }
  addEventListener("scroll", onScroll, {passive:true}); onScroll();
})();

</script>
